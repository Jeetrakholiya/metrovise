      </div>

      ${pays.length > 0 ? `
        <div style="font-size:11.5px; font-weight:700; color:var(--text-muted); margin-bottom:6px;">Recorded Transactions (${pays.length}):</div>
        <div style="display:flex; flex-direction:column; gap:6px; max-height:120px; overflow-y:auto;">
          ${pays.map(p => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); padding:6px 10px; border-radius:6px; border:1px solid var(--border-subtle); font-size:12px;">
              <div>
                <span class="mono" style="font-weight:700; color:var(--signal-cash);">${fmtMoney(p.amount)}</span>
                <span style="color:var(--text-muted);"> · ${fmtDate(p.date)} (${esc(p.mode)})</span>
              </div>
              <button type="button" class="btn btn-danger-ghost btn-sm" onclick="event.stopPropagation(); deleteClientPaymentDirect('${p.id}', '${clientId}')" style="padding:2px 6px; font-size:11px;">🗑️ Delete</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>

    <div class="field">
      <label>Client Specific Notes & Preferences</label>
      <textarea id="f_edit_cl_notes" rows="2" placeholder="e.g. Preferred posting times, brand aesthetics, custom contract requirements...">${esc(c.notes || '')}</textarea>
    </div>

    <div class="modal-actions" style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn btn-danger-ghost btn-sm" id="btnDeleteClient">🗑️ Delete Client</button>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="btnSaveClientDetails" style="font-weight:700;">Save All Changes ➔</button>
      </div>
    </div>
  `, 580);

  const servSel = document.getElementById('f_edit_cl_service');
  if (servSel) {
    servSel.onchange = () => {
      const isCust = servSel.value === '__custom__';
      const box = document.getElementById('f_edit_cl_service_custom_box');
      if (box) box.style.display = isCust ? 'block' : 'none';
      if (isCust) {
        const inp = document.getElementById('f_edit_cl_service_custom');
        if (inp) inp.focus();
      } else {
        const selected = servSel.options[servSel.selectedIndex];
        const pr = selected.dataset.price;
        if (pr) document.getElementById('f_edit_cl_amount').value = pr;
      }
    };
  }

  const statSel = document.getElementById('f_edit_cl_status');
  if (statSel) {
    statSel.onchange = () => {
      const isCust = statSel.value === '__custom__';
      const box = document.getElementById('f_edit_cl_status_custom_box');
      if (box) box.style.display = isCust ? 'block' : 'none';
      if (isCust) { const inp = document.getElementById('f_edit_cl_status_custom'); if (inp) inp.focus(); }
    };
  }

  const pkgStatSel = document.getElementById('f_edit_pkg_status');
  if (pkgStatSel) {
    pkgStatSel.onchange = () => {
      const isCust = pkgStatSel.value === '__custom__';
      const box = document.getElementById('f_edit_pkg_status_custom_box');
      if (box) box.style.display = isCust ? 'block' : 'none';
      if (isCust) { const inp = document.getElementById('f_edit_pkg_status_custom'); if (inp) inp.focus(); }
    };
  }

  document.getElementById('btnSaveClientDetails').onclick = () => {
    const name = document.getElementById('f_edit_cl_name').value.trim();
    if (!name) { toast('Client name is required'); return; }

    let stVal = document.getElementById('f_edit_cl_status').value;
    if (stVal === '__custom__') {
      stVal = (document.getElementById('f_edit_cl_status_custom') ? document.getElementById('f_edit_cl_status_custom').value.trim() : '') || 'Active';
    }

    c.name = name;
    c.company = document.getElementById('f_edit_cl_company').value.trim();
    c.mobile = document.getElementById('f_edit_cl_mobile').value.trim();
    c.whatsapp = document.getElementById('f_edit_cl_wa').value.trim();
    c.instagram = document.getElementById('f_edit_cl_insta').value.trim();
    c.status = stVal;
    c.notes = document.getElementById('f_edit_cl_notes').value.trim();

    let serviceType = document.getElementById('f_edit_cl_service').value;
    if (serviceType === '__custom__') {
      serviceType = (document.getElementById('f_edit_cl_service_custom') ? document.getElementById('f_edit_cl_service_custom').value.trim() : '') || 'Custom Retainer';
    }

    const amount = Number(document.getElementById('f_edit_cl_amount').value) || 0;
    const startDate = document.getElementById('f_edit_cl_start').value;
    const endDate = document.getElementById('f_edit_cl_end').value;
    const assignedStaffId = document.getElementById('f_edit_cl_staff').value;
    
    let pkgStatus = document.getElementById('f_edit_pkg_status').value;
    if (pkgStatus === '__custom__') {
      pkgStatus = (document.getElementById('f_edit_pkg_status_custom') ? document.getElementById('f_edit_pkg_status_custom').value.trim() : '') || 'Active';
    }

    let targetPkg = STATE.packages.find(p => p.id === pkg.id);
    if (targetPkg) {
      targetPkg.serviceType = serviceType;
      targetPkg.amount = amount;
      targetPkg.startDate = startDate;
      targetPkg.endDate = endDate;
      targetPkg.assignedStaffId = assignedStaffId;
      targetPkg.status = pkgStatus;
    } else {
      targetPkg = {
        id: pkg.id || uid('pkg'),
        clientId: c.id,
        serviceType,
        amount,
        startDate,
        endDate,
        assignedStaffId,
        status: pkgStatus
      };
      STATE.packages.push(targetPkg);
    }

    // Handle Adjusted Collected Amount
    const editedCollected = Number(document.getElementById('f_edit_cl_collected').value);
    if (!isNaN(editedCollected)) {
      const currentPaid = out.paid;
      if (editedCollected !== currentPaid) {
        if (editedCollected === 0) {
          STATE.payments = STATE.payments.filter(p => p.clientId !== clientId);
        } else if (pays.length === 1) {
          pays[0].amount = editedCollected;
        } else if (pays.length === 0) {
          STATE.payments.push({
            id: uid('pay'),
            clientId: clientId,
            packageId: targetPkg.id,
            amount: editedCollected,
            date: todayStr(),
            mode: 'UPI (GPay / PhonePe / Paytm)',
            note: 'Advance payment'
          });
        } else {
          // Replace multiple with single adjusted entry
          STATE.payments = STATE.payments.filter(p => p.clientId !== clientId);
          STATE.payments.push({
            id: uid('pay'),
            clientId: clientId,
            packageId: targetPkg.id,
            amount: editedCollected,
            date: todayStr(),
            mode: 'UPI (GPay / PhonePe / Paytm)',
            note: 'Adjusted collected payment'
          });
        }
      }
    }

    saveState();
    closeModal();
    toast(`✓ Client details for "${c.name}" updated successfully!`);
    render();
  };

  document.getElementById('btnDeleteClient').onclick = () => {
    if (confirm(`Are you sure you want to delete client "${c.name}" and all associated packages? This action cannot be undone.`)) {
      STATE.clients = STATE.clients.filter(cl => cl.id !== clientId);
      STATE.packages = STATE.packages.filter(p => p.clientId !== clientId);
      STATE.payments = STATE.payments.filter(p => p.clientId !== clientId);
      saveState();
      closeModal();
      toast(`Client "${c.name}" removed.`);
      render();
    }
  };
}

function openMultiLangMessageModal(type = 'reminder', clientId, paymentId = null) {
  const c = STATE.clients.find(cl => cl.id === clientId);
  if (!c) return;

  const pkg = activePackage(clientId);
  const out = clientOutstanding(clientId);
  const payment = paymentId ? STATE.payments.find(p => p.id === paymentId) : (STATE.payments.filter(p => p.clientId === clientId)[0] || { amount: 0, date: todayStr(), mode: 'UPI' });
  const agencyName = (STATE.settings && STATE.settings.agencyName) || 'AccountiX';

  let selectedLang = 'en';

  function getGeneratedMessage(langKey) {
    const group = MULTI_LANG_TRANSLATIONS[type] || MULTI_LANG_TRANSLATIONS.reminder;
    const entry = group[langKey] || group.en;
    return entry.gen(c, payment, out.pending, agencyName, pkg);
  }

  const titleMap = {
    receipt: `🧾 Payment Receipt (${fmtMoney(payment.amount)})`,
    reminder: `⏰ Payment Due Reminder (${fmtMoney(out.pending)})`,
    renewal: `🔄 Package Renewal Notice`
  };

    <div class="modal-header">
      <div>
        <h3 class="modal-title">${titleMap[type] || 'Send Client Message'}</h3>
        <div style="font-size:12px; color:var(--text-muted);">Choose target language to automatically generate personalized client message for ${esc(c.name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-size:11.5px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:8px;">
        🌐 Select Message Language
      </label>
      <div style="display:flex; gap:6px; flex-wrap:wrap;" id="langBtnContainer">
        ${Object.keys(MULTI_LANG_TRANSLATIONS[type] || {}).map(k => `
          <button type="button" class="btn btn-sm ${k === selectedLang ? 'btn-primary' : 'btn-ghost'}" data-lang-key="${k}" style="font-size:12px; padding:5px 10px;">
            ${MULTI_LANG_TRANSLATIONS[type][k].name}
          </button>
        `).join('')}
      </div>
    </div>

    <!-- Live Generated Message Box -->
    <div class="field" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="margin-bottom:0;">Generated Message Preview</label>
        <span style="font-size:11px; color:var(--text-muted);">Editable before sending</span>

          <span>💬</span> Send via WhatsApp ➔
        </button>
      </div>
    </div>
  `, 560);

  const container = document.getElementById('langBtnContainer');
  if (container) {
    container.querySelectorAll('[data-lang-key]').forEach(btn => {
      btn.onclick = () => {
        selectedLang = btn.dataset.langKey;
        container.querySelectorAll('[data-lang-key]').forEach(b => {
          b.className = `btn btn-sm ${b.dataset.langKey === selectedLang ? 'btn-primary' : 'btn-ghost'}`;
        });
        const msgEl = document.getElementById('multiLangMsgText');
        if (msgEl) msgEl.value = getGeneratedMessage(selectedLang);
      };
    });
  }

  const copyBtn = document.getElementById('btnCopyMultiLangMsg');
  if (copyBtn) {
    copyBtn.onclick = () => {

  const waBtn = document.getElementById('btnSendMultiLangWa');

/* ================= MULTI-PACKAGE RENEWAL WORKFLOW ================= */
let activeRenewRows = [];

function openMultiRenewModal(clientId) {
  const client = STATE.clients.find(c => c.id === clientId);
  if (!client) return;

  const catalog = getServiceCatalog();
  const last = activePackage(clientId);

  activeRenewRows = [
    {
      id: uid('rnrow'),
      serviceType: last ? last.serviceType : catalog[0].name,
      amount: last ? last.amount : getServiceDefaultPrice(catalog[0].name),
      startDate: todayStr(),
      endDate: addMonths(todayStr(), 1),
      assignedStaffId: last ? last.assignedStaffId : ''
    }
  ];

  renderMultiRenewModalContent(clientId);
}

function renderMultiRenewModalContent(clientId) {
  const client = STATE.clients.find(c => c.id === clientId);
  const catalog = getServiceCatalog();
  const totalRenewSum = activeRenewRows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const earliestEnd = activeRenewRows[0] ? activeRenewRows[0].endDate : addMonths(todayStr(), 1);

  showModal(`
    <div class="modal-header">
      <div>
        <h3 class="modal-title">Renew & Add Packages — ${esc(client.name)}</h3>
        <div style="font-size:12px; color:var(--text-muted);">Add single or multiple service packages for the next billing cycle</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="card" style="background:var(--brand-soft); border-color:var(--brand); margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:12px; font-weight:700; color:var(--brand);">Combined Renewal Amount</div>
          <div class="mono" style="font-size:22px; font-weight:800; color:var(--signal-cash);">${fmtMoney(totalRenewSum)}</div>
        </div>
        <button class="wa-btn btn-sm" id="sendMultiRenewWaBtn">
          Send WhatsApp Renewal Notice (${activeRenewRows.length} Services)
        </button>
      </div>
    </div>

    <div id="renewRowsList" style="display:flex; flex-direction:column; gap:12px; max-height:360px; overflow-y:auto; padding-right:4px;">
      ${activeRenewRows.map((row, idx) => `
        <div class="card" style="padding:14px 16px; background:var(--bg-subtle); border:1px solid var(--border-card);" data-row-idx="${idx}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div style="font-size:12px; font-weight:700; color:var(--brand); text-transform:uppercase;">
              Package #${idx + 1}
            </div>
            ${activeRenewRows.length > 1 ? `
              <button class="btn btn-danger-ghost btn-sm" style="padding:2px 8px; font-size:11px;" onclick="removeRenewRow(${idx}, '${clientId}')">
                Remove ✕
              </button>
            ` : ''}
          </div>

          <div class="field" style="margin-bottom:8px;">
            <label style="font-size:11px;">Service Package (Catalog)</label>
            <select class="renew-service-select" data-row-field="serviceType" data-idx="${idx}" style="font-size:12.5px; padding:7px 10px;">
              ${catalog.map(s => `
                <option value="${esc(s.name)}" data-default="${s.defaultAmount}" ${s.name === row.serviceType ? 'selected' : ''}>
                  ${esc(s.name)} — Standard: ${fmtMoney(s.defaultAmount)}
                </option>
              `).join('')}
              <option value="__custom__" data-default="35000">➕ Custom Service Package...</option>
            </select>
          </div>

          <div class="field-row" style="margin-bottom:8px;">
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Amount (${STATE.settings.currencySymbol || '₹'})</label>
              <input type="number" class="renew-input" data-row-field="amount" data-idx="${idx}" value="${row.amount}" style="font-size:12.5px; padding:7px 10px;" />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Assigned Specialist</label>
              <select class="renew-input" data-row-field="assignedStaffId" data-idx="${idx}" style="font-size:12.5px; padding:7px 10px;">
                <option value="">— Unassigned —</option>
                ${STATE.staff.map(st => `
                  <option value="${st.id}" ${st.id === row.assignedStaffId ? 'selected' : ''}>${esc(st.name)}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Cycle Start</label>
              <input type="date" class="renew-input" data-row-field="startDate" data-idx="${idx}" value="${row.startDate}" style="font-size:12.5px; padding:7px 10px;" />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label style="font-size:11px;">Cycle End</label>
              <input type="date" class="renew-input" data-row-field="endDate" data-idx="${idx}" value="${row.endDate}" style="font-size:12.5px; padding:7px 10px;" />
            </div>
          </div>
        </div>
      `).join('')}
    </div>

    <div style="margin-top:10px;">
      <button class="btn btn-ghost btn-sm" style="width:100%; border-style:dashed;" onclick="addRenewRow('${clientId}')">
        ➕ Add Another Service / Package
      </button>
    </div>

    <div class="field-row" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border-subtle);">
      <div class="field" style="margin-bottom:0;">
        <label>Payment Received Now (${STATE.settings.currencySymbol || '₹'})</label>
        <input type="number" id="f_rn_rec_pay" value="0" placeholder="0" />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Payment Mode</label>
        <select id="f_rn_rec_mode">
          ${PAYMENT_MODES.map(m => `<option>${m}</option>`).join('')}
          <option value="__custom__">➕ Custom Payment Mode...</option>
        </select>
        <div id="f_rn_rec_mode_custom_box" style="display:none; margin-top:6px;">
          <input id="f_rn_rec_mode_custom" placeholder="Enter custom payment mode" />
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="confirmSaveMultiRenewBtn">
        Confirm & Save ${activeRenewRows.length} Package(s)
      </button>
    </div>
  `, 640);

  const rnModeSel = document.getElementById('f_rn_rec_mode');
  if (rnModeSel) {
    rnModeSel.onchange = (e) => {
      const isCust = e.target.value === '__custom__';
      const box = document.getElementById('f_rn_rec_mode_custom_box');
      if (box) box.style.display = isCust ? 'block' : 'none';
      if (isCust) { const inp = document.getElementById('f_rn_rec_mode_custom'); if (inp) inp.focus(); }
    };
  }

  document.querySelectorAll('.renew-service-select').forEach(el => {
    el.onchange = (e) => {
      const idx = Number(el.dataset.idx);
      if (el.value === '__custom__') {
        const custName = prompt('Enter custom service package name:');
        if (custName && custName.trim()) {
          activeRenewRows[idx].serviceType = custName.trim();
        }
      } else {
        const selected = el.options[el.selectedIndex];
        const defPrice = Number(selected.dataset.default) || 35000;
        activeRenewRows[idx].serviceType = el.value;
        activeRenewRows[idx].amount = defPrice;
      }
      renderMultiRenewModalContent(clientId);
    };
  });

  document.querySelectorAll('.renew-input').forEach(el => {
    el.oninput = () => {
      const idx = Number(el.dataset.idx);
      const field = el.dataset.rowField;
      activeRenewRows[idx][field] = field === 'amount' ? (Number(el.value) || 0) : el.value;
    };
  });

  const waBtn = document.getElementById('sendMultiRenewWaBtn');
  if (waBtn && client) {
    waBtn.onclick = () => {
      openMultiLangMessageModal('renewal', clientId);
    };
  }

  document.getElementById('confirmSaveMultiRenewBtn').onclick = () => {
    if (!activeRenewRows.length) {
      toast('At least one package is required');
      return;
    }

    activeRenewRows.forEach(row => {
      STATE.packages.push({
        id: uid('pkg'),
        clientId,
        serviceType: row.serviceType,
        amount: Number(row.amount) || 0,
        startDate: row.startDate,
        endDate: row.endDate,
        assignedStaffId: row.assignedStaffId || '',
        status: 'Active'
      });
    });

    const recPay = Number(document.getElementById('f_rn_rec_pay').value) || 0;
    if (recPay > 0) {
      let modeVal = document.getElementById('f_rn_rec_mode').value;
      if (modeVal === '__custom__') {
        modeVal = (document.getElementById('f_rn_rec_mode_custom') ? document.getElementById('f_rn_rec_mode_custom').value.trim() : '') || 'Custom Payment';
      }
      STATE.payments.push({
        id: uid('pay'),
        clientId,
        amount: recPay,
        date: todayStr(),
        mode: modeVal,
        note: `Renewal advance payment (${activeRenewRows.length} services)`
      });
    }

    saveState();
    closeModal();
    toast(`Saved ${activeRenewRows.length} package(s) totaling ${fmtMoney(totalRenewSum)}`);
    render();
  };
}

window.addRenewRow = (clientId) => {
  const catalog = getServiceCatalog();
  activeRenewRows.push({
    id: uid('rnrow'),
    serviceType: catalog[0].name,
    amount: catalog[0].defaultAmount,
    startDate: todayStr(),
    endDate: addMonths(todayStr(), 1),
    assignedStaffId: ''
  });
  renderMultiRenewModalContent(clientId);
};

window.removeRenewRow = (idx, clientId) => {
  activeRenewRows.splice(idx, 1);
  renderMultiRenewModalContent(clientId);
};

/* ---------- 3. STUDIO & DELIVERABLES PIPELINE ---------- */
function renderContentView() {
  const currentTab = STATE._workTab || 'kanban';
  const prof = getProfessionConfig();
  const items = STATE.contentItems.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const columns = [
    { status: 'Idea', label: '💡 Brief & Conception' },
    { status: 'In Progress', label: '📌 In Progress / Assigned' },
    { status: 'Under Review', label: '⚙️ Internal Review / Polish' },
    { status: 'Client Approval', label: '⏳ Client Review & Sign-Off' },
    { status: 'Completed / Delivered', label: '🚀 Delivered / Completed' }
  ];

  return `
    <div class="view-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 class="view-title">Deliverables & Workflow Pipeline</h1>
        <p class="view-sub" style="color:var(--text-secondary);">${items.length} ${esc(prof.deliverableTerm.toLowerCase())} in production for ${esc(prof.shortName)}</p>
      </div>
      <button class="btn btn-primary" id="newCntBtn"><span>+</span> Add Deliverable</button>
    </div>
    <div class="tabs">
      <div class="tab ${currentTab === 'kanban' ? 'active' : ''}" data-ctab="kanban"><span>📋</span> Kanban Board</div>
      <div class="tab ${currentTab === 'table' ? 'active' : ''}" data-ctab="table"><span>📅</span> Schedule Table</div>
    </div>
    ${currentTab === 'kanban' ? `
      <div class="kanban-board">
        ${columns.map(col => {
          const colItems = items.filter(it => {
            if (col.status === 'In Progress') return it.status === 'In Progress' || it.status === 'Shoot Assigned' || it.status === 'Shoot Done' || it.status === 'Assigned';
            if (col.status === 'Under Review') return it.status === 'Under Review' || it.status === 'Editing' || it.status === 'Edit Done';
            if (col.status === 'Client Approval') return it.status === 'Client Approval' || it.status === 'Approved';
            if (col.status === 'Completed / Delivered') return it.status === 'Completed / Delivered' || it.status === 'Uploaded/Posted';
            return it.status === col.status;
          });
          return `<div class="kanban-column">
            <div class="kanban-header"><span>${col.label}</span><span class="nav-counter">${colItems.length}</span></div>
            <div class="kanban-cards-wrap">${colItems.map(it => {
              const client = STATE.clients.find(c => c.id === it.clientId);
              const specialist = STATE.staff.find(s => s.id === it.assignedStaffId || s.id === it.shootById);
              return `<div class="kanban-card" data-edit-cnt="${it.id}">
                <div class="kanban-card-title">${esc(it.topic || it.type)}</div>
                <div class="kanban-card-client">${esc(client ? client.name : 'No client')}</div>
                <div style="display:flex; gap:4px; margin-bottom:6px;"><span class="pill pill-gray" style="font-size:10px;">${it.type}</span><span class="pill pill-brand" style="font-size:10px;">${it.status}</span></div>
                <div class="kanban-card-meta"><span>📅 ${fmtDate(it.date)}</span><span>${specialist ? `👤 ${esc(specialist.name.split(' ')[0])}` : ''}</span></div>
                ${it.status === 'Client Approval' && client ? `<button class="wa-btn btn-sm" style="width:100%; justify-content:center; margin-top:8px;" data-wa-appr="${it.id}">WhatsApp Approval</button>` : ''}
              </div>`;
            }).join('') || `<div class="empty" style="padding:20px 0; font-size:12px;">No items</div>`}</div>
          </div>`;
        }).join('')}
      </div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Client Account</th><th>Target Date</th><th>Deliverable Type</th><th>Title / Scope</th><th>Lead Specialist</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${items.map(it => {
              const client = STATE.clients.find(c => c.id === it.clientId);
              const specialist = STATE.staff.find(s => s.id === it.assignedStaffId || s.id === it.shootById);
              return `<tr>
                <td><b>${esc(client ? client.name : '—')}</b></td>
                <td>${fmtDate(it.date)}</td>
                <td><span class="pill pill-gray">${it.type}</span></td>
                <td><b>${esc(it.topic || '—')}</b></td>
                <td>${specialist ? esc(specialist.name) : '—'}</td>
                <td><select data-cnt-status="${it.id}" style="padding:5px; font-size:12px; border-radius:6px;">${CONTENT_STATUSES.map(s => `<option ${s === it.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
                <td><div style="display:flex; gap:6px;">${it.driveLink ? `<a href="${it.driveLink}" target="_blank" class="btn btn-ghost btn-sm">📁 Link</a>` : ''} ${client ? `<button class="wa-btn btn-sm" data-wa-appr="${it.id}">WA Approval</button>` : ''} <button class="btn btn-ghost btn-sm" data-edit-cnt="${it.id}">Edit</button></div></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `}
  `;
}
function attachContent() {
  document.querySelectorAll('[data-ctab]').forEach(el => el.onclick = () => { STATE._workTab = el.dataset.ctab; renderMain(); });
  const n = document.getElementById('newCntBtn'); if (n) n.onclick = () => openContentModal();
  document.querySelectorAll('[data-edit-cnt]').forEach(el => el.onclick = (e) => { if (!e.target.closest('button') && !e.target.closest('select')) openContentModal(el.dataset.editCnt); });
  document.querySelectorAll('[data-cnt-status]').forEach(el => el.onchange = () => {
    const it = STATE.contentItems.find(i => i.id === el.dataset.cntStatus);
    if (it) { it.status = el.value; saveState(); toast('Status updated'); renderMain(); }
  });
  document.querySelectorAll('[data-wa-appr]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const it = STATE.contentItems.find(i => i.id === el.dataset.waAppr);
      if (!it) return;
      const c = STATE.clients.find(cl => cl.id === it.clientId);
      if (c) sendWa(c.whatsapp || c.mobile, WA_TEMPLATES.approval(c.name, it.type, it.topic, it.driveLink, STATE.settings.agencyName));
    };
  });

function attachSales() {
  document.querySelectorAll('[data-stab]').forEach(el => el.onclick = () => { STATE._salesTab = el.dataset.stab; renderMain(); });
  const n = document.getElementById('newLeadBtn'); if (n) n.onclick = () => openLeadModal();
  document.querySelectorAll('[data-edit-ld]').forEach(el => el.onclick = (e) => { if (!e.target.closest('button') && !e.target.closest('select')) openLeadModal(el.dataset.editLd); });
  document.querySelectorAll('[data-ld-st]').forEach(el => el.onchange = () => {
    const l = STATE.leads.find(i => i.id === el.dataset.ldSt);
    if (l) { l.status = el.value; saveState(); toast('Stage updated'); renderMain(); }
  });
  document.querySelectorAll('[data-conv-ld]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const l = STATE.leads.find(i => i.id === el.dataset.convLd);
      if (l) { l.status = 'Won'; saveState(); openNewClientModal(l); }
    };
  });
  document.querySelectorAll('[data-wa-ld]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const l = STATE.leads.find(i => i.id === el.dataset.waLd);
      if (l) sendWa(l.phone, WA_TEMPLATES.followUp(l.name, l.service, STATE.settings.agencyName));
    };
  });
}

          </table>
        </div>
      </div>

      <!-- Monthly Full Timesheet Sheet Matrix (Calendar View) -->
      <div class="card">
        <div class="card-title">
          <span>📅 Monthly Attendance Timesheet Matrix (${fmtMonthYear(ym)})</span>
          <span style="font-size:11.5px; color:var(--text-muted); font-weight:normal;">Legend: <span class="pill pill-green" style="font-size:9px; padding:1px 5px;">P</span> Present · <span class="pill pill-amber" style="font-size:9px; padding:1px 5px;">½</span> Half Day · <span class="pill pill-red" style="font-size:9px; padding:1px 5px;">A</span> Absent</span>
        </div>
        
        <div class="table-wrap" style="margin-bottom:0; max-height:480px; overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th style="position:sticky; left:0; background:var(--bg-subtle); z-index:2; min-width:140px;">Team Member</th>
                ${Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => `<th style="text-align:center; padding:8px 6px; font-size:10px; min-width:32px;">${d}</th>`).join('')}
                <th style="text-align:center; min-width:60px;">Present</th>
                <th style="text-align:center; min-width:60px;">Half Days</th>
                <th style="text-align:center; min-width:60px;">Rate</th>
              </tr>
            </thead>
            <tbody>
              ${staff.map(s => {
                let pCount = 0, hCount = 0, aCount = 0;
                const dayCells = Array.from({ length: daysInMonth }, (_, i) => {
                  const dNum = String(i + 1).padStart(2, '0');
                  const dtStr = `${ym}-${dNum}`;
                  const rec = STATE.attendance.find(a => a.staffId === s.id && a.date === dtStr);
                  const st = rec ? rec.status : '';
                  if (st === 'Present') pCount++;
                  else if (st === 'Half Day') hCount++;
                  else if (st === 'Absent') aCount++;

                  let badge = '<span style="color:var(--text-faint); font-size:11px;">·</span>';
                  if (st === 'Present') badge = '<span class="pill pill-green" style="padding:1px 5px; font-size:10px;">P</span>';
                  else if (st === 'Half Day') badge = '<span class="pill pill-amber" style="padding:1px 4px; font-size:10px;">½</span>';
                  else if (st === 'Absent') badge = '<span class="pill pill-red" style="padding:1px 5px; font-size:10px;">A</span>';

                  return `<td style="text-align:center; padding:6px 2px; cursor:pointer;" data-toggle-cell="${s.id}_${dtStr}" title="${esc(s.name)} on ${dtStr}: ${st || 'Unmarked'} (Click to toggle)">${badge}</td>`;
                }).join('');

                const effectivePresent = pCount + (hCount * 0.5);
                const totalMarked = pCount + hCount + aCount;
                const attRate = totalMarked > 0 ? Math.round((effectivePresent / totalMarked) * 100) : 100;

                return `
                  <tr>
                    <td style="position:sticky; left:0; background:var(--bg-card); z-index:1; font-weight:700;">
                      <div>${esc(s.name)}</div>
                      <div style="font-size:10.5px; color:var(--text-muted); font-weight:normal;">${esc(s.role || '')}</div>
                    </td>
                    ${dayCells}
                    <td class="mono" style="text-align:center; font-weight:700; color:var(--signal-cash);">${pCount}</td>
                    <td class="mono" style="text-align:center; font-weight:700; color:var(--accent-amber);">${hCount}</td>
                    <td class="mono font-weight-bold" style="text-align:center; color:${attRate >= 80 ? 'var(--signal-cash)' : 'var(--accent-rose)'};">${attRate}%</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Staff</th><th>Role</th><th>Base</th><th>Paid This Month</th><th>Action</th></tr></thead>
          <tbody>${staff.map(s => {
            const paid = STATE.salaryPayments.filter(p => p.staffId === s.id && p.month === ym).reduce((sum, p) => sum + (Number(p.finalPayable) || 0), 0);
            return `<tr>
              <td><b>${esc(s.name)}</b></td><td>${esc(s.role || '—')}</td><td class="mono">${fmtMoney(s.baseSalary)}</td>
              <td class="mono" style="color:${paid > 0 ? 'var(--signal-cash)' : 'var(--text-muted)'}; font-weight:700;">${fmtMoney(paid)}</td>
              <td><button class="btn btn-signal btn-sm" data-pay-sal="${s.id}">Calculate & Pay Salary</button></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    `}
  `;
}

function attachTeam() {
  document.querySelectorAll('[data-ttab]').forEach(el => el.onclick = () => { STATE._teamTab = el.dataset.ttab; renderMain(); });
  const n = document.getElementById('newStaffBtn'); if (n) n.onclick = () => openStaffModal();
  document.querySelectorAll('[data-edit-st]').forEach(el => el.onclick = () => openStaffModal(el.dataset.editSt));
  document.querySelectorAll('[data-pay-sal]').forEach(el => el.onclick = () => openPaySalaryModal(el.dataset.paySal));

  const dtPick = document.getElementById('attDatePick');
  if (dtPick) {
    dtPick.onchange = (e) => {
      STATE._attDate = e.target.value;
      renderMain();
    };
  }

  const markAllBtn = document.getElementById('markAllPresBtn');
  if (markAllBtn) {
    markAllBtn.onclick = () => {
      const curDate = STATE._attDate || todayStr();
      STATE.staff.forEach(s => {
        let r = STATE.attendance.find(a => a.staffId === s.id && a.date === curDate);
        if (!r) {
          r = { id: uid('att'), staffId: s.id, date: curDate };
          STATE.attendance.push(r);
        }
        r.status = 'Present';
        if (!r.checkIn) r.checkIn = '09:30 AM';
      });
      saveState();
      toast(`Marked all ${STATE.staff.length} staff Present on ${fmtDate(curDate)}`);
      renderMain();
    };
  }

  document.querySelectorAll('[data-att-set]').forEach(el => {
    el.onclick = () => {
      const [sid, st] = el.dataset.attSet.split('-');
      const targetDate = STATE._attDate || todayStr();
      let r = STATE.attendance.find(a => a.staffId === sid && a.date === targetDate);
      if (!r) { r = { id: uid('att'), staffId: sid, date: targetDate }; STATE.attendance.push(r); }
      r.status = st;
      if (st === 'Present' && !r.checkIn) r.checkIn = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      saveState(); toast('Attendance logged'); renderMain();
    };
  });

  document.querySelectorAll('[data-toggle-cell]').forEach(el => {
    el.onclick = () => {
      const [sid, dtStr] = el.dataset.toggleCell.split('_');
      let r = STATE.attendance.find(a => a.staffId === sid && a.date === dtStr);
      if (!r) {
        r = { id: uid('att'), staffId: sid, date: dtStr, status: 'Present', checkIn: '09:30 AM' };
        STATE.attendance.push(r);
      } else {
        if (r.status === 'Present') r.status = 'Half Day';
        else if (r.status === 'Half Day') r.status = 'Absent';
        else if (r.status === 'Absent') r.status = 'Present';
        else r.status = 'Present';
      }
      saveState();
      renderMain();
    };
  });
}

    if (role === '__custom__') {
      role = (document.getElementById('f_st_rl_custom') ? document.getElementById('f_st_rl_custom').value.trim() : '') || 'Specialist';
    }

    const phone = document.getElementById('f_st_ph').value.trim();
    const email = document.getElementById('f_st_em').value.trim();
    const baseSalary = Number(document.getElementById('f_st_sal').value) || 0;
    const pass = (document.getElementById('f_st_pass').value || '').trim() || `Staff@${Math.floor(1000 + Math.random() * 9000)}`;
    const shouldSendEmail = document.getElementById('f_st_send_email') ? document.getElementById('f_st_send_email').checked : true;

    if (!email) {
      toast('Staff email address is required for portal login & invite');
      return;
    }

    const saveBtn = document.getElementById('saveStBtn');
    saveBtn.innerHTML = 'Sending Invite & Saving... ⏳';

    let targetStaffId;
    if (staffId) {
      targetStaffId = staffId;
      Object.assign(s, { name: nm, role, phone, email, baseSalary, defaultPassword: pass });
    } else {
      targetStaffId = uid('st');
      STATE.staff.push({ id: targetStaffId, name: nm, role, phone, email, baseSalary, defaultPassword: pass, status: 'Active' });
    }

    // Auto-provision or update user account for Employee Portal login
    let empUser = (STATE.allUsers || []).find(u => u.staffId === targetStaffId || (u.email && u.email.toLowerCase() === email.toLowerCase()));
    if (!empUser) {
      empUser = {
        id: `usr_emp_${targetStaffId}`,
        name: nm,
        email: email,
        password: pass,
        mustChangePassword: true,
        role: 'employee',
        staffId: targetStaffId,
        companyId: STATE.currentUser ? (STATE.currentUser.companyId || 'comp_1') : 'comp_1',
        companyName: STATE.settings.agencyName || 'AccountiX Media HQ',
        title: role,
        avatar: role.includes('Video') || role.includes('Editor') ? '🎬' : role.includes('Shoot') || role.includes('Camera') ? '📹' : '👥',
        lastActiveAt: new Date().toISOString(),
        status: 'Active',
        purchasedDate: todayStr(),
        plan: 'Enterprise Suite'
      };
      if (!STATE.allUsers) STATE.allUsers = [];
      STATE.allUsers.push(empUser);
      if (!DEMO_PROFILES.find(p => p.id === empUser.id)) {
        DEMO_PROFILES.push(empUser);
      }
    } else {
      empUser.name = nm;
      empUser.email = email;
      empUser.title = role;
      empUser.password = pass;
      empUser.mustChangePassword = true;
      empUser.staffId = targetStaffId;
    }

    let inviteData = null;
    // Trigger Invite if selected
    if (shouldSendEmail && window.AccountiX_API && typeof window.AccountiX_API.inviteStaff === 'function') {
      try {
        const inviteRes = await window.AccountiX_API.inviteStaff({
          toEmail: email,
          staffName: nm,
          role,
          temporaryPassword: pass,
          agencyName: STATE.settings.agencyName || 'AccountiX Media HQ',
          loginUrl: window.location.origin,
          staffId: targetStaffId,
          baseSalary
        });
        inviteData = inviteRes;
      } catch(e) {
        console.warn('Invite trigger fallback:', e);
      }
    }

    saveState();
    closeModal();
    render();

    openStaffInviteSuccessModal({
      name: nm,
      role,
      email,
      password: pass,
      gmailComposeUrl: inviteData ? inviteData.gmailComposeUrl : null,
      mailtoUrl: inviteData ? inviteData.mailtoUrl : null,
      plainText: inviteData ? inviteData.plainText : null,
      provider: inviteData ? inviteData.provider : 'email'
    });
  };

  const dBtn = document.getElementById('delStBtn');
  if (dBtn) {
    dBtn.onclick = () => {
      STATE.staff = STATE.staff.filter(i => i.id !== staffId);
      STATE.allUsers = (STATE.allUsers || []).filter(u => u.staffId !== staffId);
      saveState();
      closeModal();
      toast('Staff removed');
      render();
    };
  }
}

function openPaySalaryModal(staffId) {

  showModal(`

    <div class="card" style="background:var(--bg-subtle); padding:12px; margin-bottom:14px; font-size:12px;">Role: <b>${esc(s.role)}</b> · Contracted Base: <b>${fmtMoney(s.baseSalary)}</b></div>
    <div class="field-row">
      <div class="field"><label>Month</label><input type="month" id="f_sp_mo" value="${currentYM()}" /></div>
      <div class="field"><label>Date</label><input type="date" id="f_sp_dt" value="${todayStr()}" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Base (₹)</label><input type="number" id="f_sp_bs" value="${s.baseSalary}" /></div>
      <div class="field"><label>Incentive (₹)</label><input type="number" id="f_sp_inc" value="0" /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Advance Repaid (₹)</label><input type="number" id="f_sp_adv" value="0" /></div>
      <div class="field"><label>Deductions (₹)</label><input type="number" id="f_sp_ded" value="0" /></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-signal" id="execPaySalBtn">Pay Salary</button></div>
  `, 520);
  document.getElementById('execPaySalBtn').onclick = () => {
    const base = Number(document.getElementById('f_sp_bs').value) || 0;
    const inc = Number(document.getElementById('f_sp_inc').value) || 0;
    const adv = Number(document.getElementById('f_sp_adv').value) || 0;
    const ded = Number(document.getElementById('f_sp_ded').value) || 0;
    const mo = document.getElementById('f_sp_mo').value;
    const dt = document.getElementById('f_sp_dt').value;
    const payable = Math.max(0, base + inc - adv - ded);

    STATE.salaryPayments.push({ id: uid('sal'), staffId: s.id, month: mo, base, incentive: inc, advance: adv, deduction: ded, finalPayable: payable, paidOn: dt });
    STATE.expenses.push({ id: uid('exp'), category: 'Salary', amount: payable, date: dt, mode: 'Bank Transfer (NEFT/IMPS/RTGS)', note: `Salary (${mo}) — ${s.name}`, staffId: s.id });

  };
}

function attachFinance() {
  document.querySelectorAll('[data-ftab]').forEach(el => el.onclick = () => { STATE._moneyTab = el.dataset.ftab; renderMain(); });
  const p = document.getElementById('fnPayBtn'); if (p) p.onclick = () => openPaymentModal();
  const e = document.getElementById('fnExpBtn'); if (e) e.onclick = () => openExpenseModal();
  document.querySelectorAll('[data-wa-rcpt]').forEach(el => {
    el.onclick = () => {
      const p = STATE.payments.find(p => p.id === el.dataset.waRcpt);
      if (p) {
        openMultiLangMessageModal('receipt', p.clientId, p.id);
      }
    };
  });
  document.querySelectorAll('[data-wa-rem-fin]').forEach(el => {
    el.onclick = () => {
      openMultiLangMessageModal('reminder', el.dataset.waRemFin);

function openPaymentModal(clientId = null) {
  const initialCid = clientId || (STATE.clients[0] ? STATE.clients[0].id : null);
  const initialOut = initialCid ? clientOutstanding(initialCid) : { pending: 0 };
  const defaultPayAmount = initialOut.pending > 0 ? initialOut.pending : '';

  showModal(`
    <div class="modal-header">
      <div>
        <h3 class="modal-title">Record Client Payment</h3>
        <div style="font-size:12px; color:var(--text-muted);">${clientId ? 'Recording payment for selected client ledger' : 'Select client and enter payment details'}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="field">
      <label>Client Account *</label>
      <select id="f_pm_cl" ${clientId ? 'disabled' : ''}>
        ${STATE.clients.map(c => {
          const out = clientOutstanding(c.id);
          return `<option value="${c.id}" data-pending="${out.pending}" ${c.id === initialCid ? 'selected' : ''}>${esc(c.name)} (${esc(c.company || 'Client')} · Pending: ${fmtMoney(out.pending)})</option>`;
        }).join('')}
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Payment Amount Received (${STATE.settings.currencySymbol || '₹'}) *</label>
        <input type="number" id="f_pm_am" value="${defaultPayAmount}" placeholder="${initialOut.pending > 0 ? initialOut.pending : '20000'}" autofocus required />
      </div>
      <div class="field">
        <label>Payment Date</label>
        <input type="date" id="f_pm_dt" value="${todayStr()}" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Payment Mode</label>
        <select id="f_pm_md">
          ${PAYMENT_MODES.map(m => `<option>${m}</option>`).join('')}
          <option value="__custom__">➕ Custom Payment Mode...</option>
        </select>
        <div id="f_pm_md_custom_box" style="display:none; margin-top:6px;">
          <input id="f_pm_md_custom" placeholder="Enter custom payment mode (e.g. Crypto / Wire / PDC)" />
        </div>
      </div>
      <div class="field">
        <label>Payment Note / Reference</label>
        <input id="f_pm_nt" placeholder="UPI Reference / Milestone" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-signal" id="savePmBtn">Record & Generate Receipt ➔</button>
    </div>
  `, 540);

  const clSel = document.getElementById('f_pm_cl');
  if (clSel && !clientId) {
    clSel.onchange = () => {
      const selected = clSel.options[clSel.selectedIndex];
      const pend = Number(selected.dataset.pending) || 0;
      const amtInput = document.getElementById('f_pm_am');
      if (amtInput) {
        amtInput.value = pend > 0 ? pend : '';
        amtInput.placeholder = pend > 0 ? pend : '20000';
      }
    };
  }

  const pmMdSel = document.getElementById('f_pm_md');
  if (pmMdSel) {
    pmMdSel.onchange = (e) => {
      const isCust = e.target.value === '__custom__';
      const box = document.getElementById('f_pm_md_custom_box');
      if (box) box.style.display = isCust ? 'block' : 'none';
      if (isCust) { const inp = document.getElementById('f_pm_md_custom'); if (inp) inp.focus(); }
    };
  }

  document.getElementById('savePmBtn').onclick = () => {
    const cid = clientId || document.getElementById('f_pm_cl').value;
    const am = Number(document.getElementById('f_pm_am').value);
    if (!am || am <= 0) { toast('Valid payment amount required'); return; }
    
    let modeVal = document.getElementById('f_pm_md').value;
    if (modeVal === '__custom__') {
      modeVal = (document.getElementById('f_pm_md_custom') ? document.getElementById('f_pm_md_custom').value.trim() : '') || 'Custom Payment';
    }

    const payId = uid('pay');
    STATE.payments.push({
      id: payId,
      clientId: cid,
      amount: am,
      date: document.getElementById('f_pm_dt').value,
      mode: modeVal,
      note: document.getElementById('f_pm_nt').value.trim()
    });
    saveState();
    closeModal();
    toast(`✓ Recorded payment of ${fmtMoney(am)}`);
    render();
    openMultiLangMessageModal('receipt', cid, payId);
  };
}

/* ---------- 7. REPORTS, AUDIT & EXPORT ---------- */
function renderReportsView() {
  const currentTab = STATE._reportTab || 'analytics';
  const now = new Date();
  const ym = currentYM();
  const months = Array.from({ length: 6 }, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    return d.toISOString().slice(0, 7);
  }).reverse();
  const history = months.map(y => ({ ym: y, ...monthStats(y) }));

  // Audit Calculations
  const totalReceived = STATE.payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const totalExpenses = STATE.expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalBooked = STATE.packages.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const totalOutstanding = STATE.clients.reduce((s, c) => s + clientOutstanding(c.id).pending, 0);
  
  // Unpaid staff this month
  const unpaidStaff = STATE.staff.filter(st => {
    const paid = STATE.salaryPayments.filter(sp => sp.staffId === st.id && sp.month === ym).reduce((sum, sp) => sum + (Number(sp.finalPayable) || 0), 0);
    return paid === 0 && st.status === 'Active';
  });

  // Expired packages with dues
  const expiredWithDues = STATE.packages.filter(p => {
    if (!p.endDate || p.status === 'Cancelled') return false;
    const isPast = daysBetween(todayStr(), p.endDate) < 0;
    const out = clientOutstanding(p.clientId);
    return isPast && out.pending > 0;
  });

  // Activity Log (latest 20 events)
  const auditEvents = [];
  STATE.payments.forEach(p => {
    const c = STATE.clients.find(cl => cl.id === p.clientId);
    auditEvents.push({ date: p.date, type: 'Payment Received', desc: `Received ${fmtMoney(p.amount)} from ${c ? c.name : 'Client'} via ${p.mode}`, category: 'INFLOW', ts: p.date });
  });
  STATE.expenses.forEach(e => {
    auditEvents.push({ date: e.date, type: 'Expense Disbursed', desc: `Spent ${fmtMoney(e.amount)} on ${e.category} (${e.note || e.mode})`, category: 'OUTFLOW', ts: e.date });
  });
  STATE.packages.forEach(p => {
    const c = STATE.clients.find(cl => cl.id === p.clientId);
    auditEvents.push({ date: p.startDate, type: 'Retainer Contract', desc: `Contracted ${p.serviceType} for ${c ? c.name : 'Client'} (${fmtMoney(p.amount)})`, category: 'CONTRACT', ts: p.startDate });
  });
  auditEvents.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));

  const auditScore = (unpaidStaff.length === 0 && expiredWithDues.length === 0) ? '100% Reconciled' : 'Attention Required';
  const isClean = auditScore === '100% Reconciled';

  return `
    <div class="view-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 class="view-title">Audit, Analytics & Compliance Center</h1>
        <p class="view-sub" style="color:var(--text-secondary);">Financial Reconciliation, Ledger Audits & Enterprise Data Portability</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="runAuditPrintBtn">📄 Print Audit Certificate</button>
        <button class="btn btn-signal" id="dlJsonBtn">⬇️ Download JSON Backup</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab ${currentTab === 'analytics' ? 'active' : ''}" data-rpttab="analytics">
        <span>📈</span> 6-Month Flow
      </div>
      <div class="tab ${currentTab === 'audit' ? 'active' : ''}" data-rpttab="audit">
        <span>🔍</span> Financial Audit & Integrity
      </div>
      <div class="tab ${currentTab === 'trail' ? 'active' : ''}" data-rpttab="trail">
        <span>📜</span> Audit Activity Trail (${auditEvents.length})
      </div>
    </div>

    ${currentTab === 'analytics' ? `
      <div class="card" style="margin-bottom:24px;">
        <div class="card-title"><span>📈 6-Month Inflows vs Outflows</span></div>
        <div class="table-wrap" style="margin-bottom:0;">
          <table>
            <thead><tr><th>Month</th><th>Collected</th><th>Spent</th><th>Owner Profit</th></tr></thead>
            <tbody>${history.map(h => `<tr>
              <td><b>${fmtMonthYear(h.ym)}</b></td>
              <td class="mono" style="color:var(--signal-cash); font-weight:700;">${fmtMoney(h.received)}</td>
              <td class="mono" style="color:var(--accent-rose);">${fmtMoney(h.expenses)}</td>
              <td class="mono font-weight-bold" style="color:${h.profit >= 0 ? 'var(--signal-cash)' : 'var(--accent-rose)'};">${fmtMoney(h.profit)}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    ` : currentTab === 'audit' ? `
      <!-- Audit Summary Cards -->
      <div class="grid grid-4" style="margin-bottom:20px;">
        <div class="card">
          <div class="stat-label">Audit Reconciliation</div>
          <div class="stat-value small ${isClean ? 'good' : 'amber'}">${auditScore}</div>
          <div class="stat-footer">${isClean ? 'Zero ledger discrepancies' : 'Action items pending'}</div>
        </div>
        <div class="card">
          <div class="stat-label">All-Time Receipts</div>
          <div class="stat-value small good">${fmtMoney(totalReceived)}</div>
          <div class="stat-footer">${STATE.payments.length} verified transactions</div>
        </div>
        <div class="card">
          <div class="stat-label">All-Time Outflows</div>
          <div class="stat-value small ${totalExpenses > 0 ? 'danger' : ''}">${fmtMoney(totalExpenses)}</div>
          <div class="stat-footer">${STATE.expenses.length} categorized entries</div>
        </div>
        <div class="card">
          <div class="stat-label">Contracted Value</div>
          <div class="stat-value small">${fmtMoney(totalBooked)}</div>
          <div class="stat-footer">${Math.round((totalReceived / (totalBooked || 1)) * 100)}% collection efficiency</div>
        </div>
      </div>

      <!-- Audit Checks Table -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-title"><span>🛡️ Automated Compliance & Ledger Checks</span></div>
        <div class="table-wrap" style="margin-bottom:0;">
          <table>
            <thead><tr><th>Audit Check Point</th><th>Status</th><th>Finding</th><th>Recommended Action</th></tr></thead>
            <tbody>
              <tr>
                <td><b>Cash Inflow vs Bank Verification</b></td>
                <td><span class="pill pill-green">✓ Balanced</span></td>
                <td>Total receipts amount to ${fmtMoney(totalReceived)} across ${STATE.payments.length} receipts</td>
                <td>No action needed</td>
              </tr>
              <tr>
                <td><b>Payroll Status (${ym})</b></td>
                <td><span class="pill ${unpaidStaff.length === 0 ? 'pill-green' : 'pill-amber'}">${unpaidStaff.length === 0 ? '✓ Disbursed' : `${unpaidStaff.length} Unpaid`}</span></td>
                <td>${unpaidStaff.length === 0 ? 'All staff salaries disbursed for this month' : `${unpaidStaff.map(s => s.name).join(', ')} pending`}</td>
                <td>${unpaidStaff.length === 0 ? 'Verified' : 'Disburse salary via Team > Payroll'}</td>
              </tr>
              <tr>
                <td><b>Overdue Client Receivables</b></td>
                <td><span class="pill ${totalOutstanding === 0 ? 'pill-green' : 'pill-amber'}">${totalOutstanding === 0 ? '✓ Cleared' : `${fmtMoney(totalOutstanding)} Dues`}</span></td>
                <td>${STATE.clients.filter(c => clientOutstanding(c.id).pending > 0).length} client account(s) with pending balances</td>
                <td>Send WhatsApp statement reminders</td>
              </tr>
              <tr>
                <td><b>Expired Packages with Dues</b></td>
                <td><span class="pill ${expiredWithDues.length === 0 ? 'pill-green' : 'pill-red'}">${expiredWithDues.length === 0 ? '✓ None' : `${expiredWithDues.length} Flagged`}</span></td>
                <td>${expiredWithDues.length === 0 ? 'No expired contracts with uncleared balances' : `${expiredWithDues.length} expired contracts have dues`}</td>
                <td>Trigger Multi-Package Renewal & collect balance</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    ` : `
      <!-- Audit Activity Trail -->
      <div class="card">
        <div class="card-title"><span>📜 Chronological System Event Audit Trail</span></div>
        <div class="table-wrap" style="margin-bottom:0;">
          <table>
            <thead><tr><th>Date</th><th>Event Type</th><th>Details</th><th>Classification</th></tr></thead>
            <tbody>
              ${auditEvents.slice(0, 30).map(ev => `
                <tr>
                  <td>${fmtDate(ev.date)}</td>
                  <td><b>${esc(ev.type)}</b></td>

    `}

}

function attachSettings() {
  document.getElementById('saveProfBtn').onclick = () => {
    const thm = document.getElementById('f_st_thm').value;
    const profKey = (document.getElementById('f_st_prof_select') ? document.getElementById('f_st_prof_select').value : '') || (STATE.settings && STATE.settings.profession) || 'general';
    STATE.settings = {
      agencyName: document.getElementById('f_st_name').value.trim() || 'AccountiX',
      tagline: document.getElementById('f_st_tag').value.trim() || 'Business Operating System',
      ownerName: document.getElementById('f_st_owner').value.trim() || 'Managing Director',
      phone: document.getElementById('f_st_ph').value.trim(),
      email: document.getElementById('f_st_em').value.trim(),
      theme: thm,
      profession: profKey,
      currencySymbol: document.getElementById('f_st_curr').value.trim() || '₹'
    };
    document.documentElement.setAttribute('data-theme', thm);
    saveState();
    toast('Business settings saved successfully');
    render();
  };

  // Supabase Connect Button
  const saveSb = document.getElementById('saveSbBtn');
  if (saveSb) {
    saveSb.onclick = async () => {
      const url = document.getElementById('f_sb_url').value.trim();
      const key = document.getElementById('f_sb_key').value.trim();
      if (!url || !key) {
        toast('Supabase URL and Anon Key are required');
        return;
      }
      setSupabaseCreds(url, key);
      toast('Connecting to Supabase Cloud...');

      // Broadcast to backend server for multi-device sync
      try {
        await fetch('/api/config/supabase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, anonKey: key })
        });
      } catch(e) {}

      const test = await testSupabaseConnection();
      if (test.success) {
        toast('🟢 Supabase Connected Successfully! Syncing...');
        await pushToSupabaseBulk();
        await syncFromSupabase();
        render();
      } else {
        alert('Supabase Connection Notice:\n\n' + test.error + '\n\nMake sure you have run the SQL schema in your Supabase SQL Editor. Click "Copy SQL Schema Script" to get the schema.');
        render();
      }
    };
  }

  // Push to Supabase Button
  const pushBtn = document.getElementById('pushSbBtn');
  if (pushBtn) {
    pushBtn.onclick = async () => {
      toast('Pushing all local data to Supabase Cloud...');
      const res = await pushToSupabaseBulk();
      if (res.success) {
        toast('✅ All data pushed to Supabase Cloud! Available on all devices.');
      } else {
        alert('Failed to push to Supabase: ' + res.error);
      }
    };
  }

  // Pull from Supabase Button
  const pullBtn = document.getElementById('pullSbBtn');
  if (pullBtn) {
    pullBtn.onclick = async () => {
      toast('Pulling latest data from Supabase Cloud...');
      await syncFromSupabase();
      toast('✅ Synced with Supabase Cloud!');
      render();
    };
  }

  // Disconnect Supabase
  const disBtn = document.getElementById('disconnectSbBtn');
  if (disBtn) {
    disBtn.onclick = () => {
      if (confirm('Disconnect Supabase Cloud Sync?\n\nYour data will continue to be safely stored in Local Storage.')) {
        setSupabaseCreds('', '');
        _supabaseClient = null;
        toast('Supabase disconnected (switched to local storage)');
        render();
      }
    };
  }

  // View & Copy SQL Schema Script
  const sqlBtn = document.getElementById('viewSqlBtn');
  if (sqlBtn) {
    sqlBtn.onclick = openSqlSchemaModal;
  }

  // Export JSON
  document.getElementById('stExportJsonBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `AccountiX_Production_Backup_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast('Database backup downloaded');
  };

  // Import JSON
  const fileInp = document.getElementById('stJsonFileInput');
  const impBtn = document.getElementById('stImportJsonBtn');
  if (impBtn && fileInp) {
    impBtn.onclick = () => fileInp.click();
    fileInp.onchange = (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && (imported.clients || imported.packages || imported.settings)) {
            Object.assign(STATE, imported);
            saveState();
            toast('Database restored successfully! 🎉');
            render();
          } else {
            alert('Invalid AccountiX backup file format.');
          }
        } catch (err) {
          alert('Failed to parse JSON file.');
        }
      };
      reader.readAsText(file);
    };
  }

  document.getElementById('launchCleanBtn').onclick = () => {
    if (confirm('Start Clean Production Database?\n\nThis will clear sample demo clients, leads, tasks, deliverables, and payments, while keeping your Agency Profile, Staff Roster, Rate Card, and Supabase connection intact.')) {
      STATE.clients = [];
      STATE.packages = [];
      STATE.payments = [];
      STATE.expenses = [];
      STATE.attendance = [];
      STATE.salaryPayments = [];
      STATE.tasks = [];
      STATE.contentItems = [];
      STATE.leads = [];
      saveState();
      toast('Production clean database ready for launch! 🚀');
      render();
    }
  };

  document.getElementById('wipeBtn').onclick = () => {
    if (confirm('Erase all data and reset to factory defaults?')) {
      STATE.clients = []; STATE.packages = []; STATE.payments = []; STATE.expenses = []; STATE.staff = []; STATE.attendance = []; STATE.salaryPayments = []; STATE.tasks = []; STATE.contentItems = []; STATE.leads = [];
      saveState(); toast('Factory data reset complete'); render();
    }
  };

  document.getElementById('reseedBtn').onclick = () => {
    if (confirm('Reload realistic sample agency demo data?')) {
      seedData();
      toast('Sample agency demo data loaded');
      render();
    }
  };
}

function openSqlSchemaModal() {

-- AccountiX Agency Business OS & Persistent Storage Schema with Supabase Auth & RLS

CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

CREATE TABLE IF NOT EXISTS user_data (

    updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Core Application Tables
CREATE TABLE IF NOT EXISTS accountix_user_profile (
    id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,

function renderSearch(query) {
  const q = query.toLowerCase();
  const clients = STATE.clients.filter(c => (c.name + ' ' + (c.company || '')).toLowerCase().includes(q));
  const content = STATE.contentItems.filter(it => (it.topic + ' ' + it.type).toLowerCase().includes(q));
  const leads = STATE.leads.filter(l => (l.name + ' ' + (l.business || '')).toLowerCase().includes(q));
  return `
    <h2 class="view-title" style="margin-bottom:16px;">Search results for "${esc(query)}"</h2>
    <div class="section-label" style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">Clients (${clients.length})</div>
    <div class="table-wrap">${clients.map(c => `<div class="row-click" style="padding:10px 14px; border-bottom:1px solid var(--border-subtle);" data-search-client="${c.id}"><b>${esc(c.name)}</b> — ${esc(c.company || '')}</div>`).join('') || `<div class="empty">No clients found</div>`}</div>
    <div class="section-label" style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">Content (${content.length})</div>
    <div class="table-wrap">${content.map(it => `<div style="padding:10px 14px; border-bottom:1px solid var(--border-subtle);"><b>${esc(it.topic || it.type)}</b> <span class="pill pill-brand" style="margin-left:8px;">${it.status}</span></div>`).join('') || `<div class="empty">No deliverables found</div>`}</div>
    <div class="section-label" style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">Leads (${leads.length})</div>
    <div class="table-wrap">${leads.map(l => `<div style="padding:10px 14px; border-bottom:1px solid var(--border-subtle);"><b>${esc(l.name)}</b> (${esc(l.business || '')}) — <span class="mono">${fmtMoney(l.budget)}</span></div>`).join('') || `<div class="empty">No leads found</div>`}</div>
  `;
}

        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-box" data-idx="1" style="width:44px; height:52px; text-align:center; font-size:24px; font-weight:900; border-radius:10px; border:1.5px solid var(--border-subtle); background:var(--bg-subtle); color:var(--text-primary); outline:none;" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-box" data-idx="2" style="width:44px; height:52px; text-align:center; font-size:24px; font-weight:900; border-radius:10px; border:1.5px solid var(--border-subtle); background:var(--bg-subtle); color:var(--text-primary); outline:none;" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-box" data-idx="3" style="width:44px; height:52px; text-align:center; font-size:24px; font-weight:900; border-radius:10px; border:1.5px solid var(--border-subtle); background:var(--bg-subtle); color:var(--text-primary); outline:none;" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-box" data-idx="4" style="width:44px; height:52px; text-align:center; font-size:24px; font-weight:900; border-radius:10px; border:1.5px solid var(--border-subtle); background:var(--bg-subtle); color:var(--text-primary); outline:none;" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-box" data-idx="5" style="width:44px; height:52px; text-align:center; font-size:24px; font-weight:900; border-radius:10px; border:1.5px solid var(--border-subtle); background:var(--bg-subtle); color:var(--text-primary); outline:none;" />
      </div>

      <div id="otpVerifyError" style="display:none; padding:10px; border-radius:8px; background:rgba(244,63,94,0.12); color:var(--accent-rose); font-size:12.5px; margin-bottom:14px; font-weight:600; text-align:center;"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-muted); margin-bottom:18px;">
        <span id="otpCooldownText">Resend in 60s</span>
        <button type="button" id="btnResendOtp" style="background:none; border:none; color:var(--brand); font-weight:700; cursor:pointer; display:none;" onclick="sendOtpRequest()">Resend OTP</button>
        <button type="button" style="background:none; border:none; color:var(--text-muted); cursor:pointer; text-decoration:underline;" onclick="showModal(renderOtpStep1(), 460)">Change Email</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-signal" id="btnVerifyOtp" onclick="verifyOtpRequest()" style="font-weight:700;">Verify & Authenticate ➔</button>
      </div>
    `;
  }

  window.sendOtpRequest = async function() {
    const input = document.getElementById('otpTargetEmail');
    if (input) targetEmail = input.value.trim();
    if (!targetEmail) {
      const err = document.getElementById('otpSendError');
      if (err) { err.textContent = 'Please enter an email address.'; err.style.display = 'block'; }
      return;
    }

    const btn = document.getElementById('btnSendOtp');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

    try {
      const res = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: targetEmail })
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Failed to send OTP');
      }

      showModal(renderOtpStep2(), 460);
      setupOtpInputHandlers();
      startCooldown(60);
      toast(data.devMode ? '🔑 [Dev Mode] Code generated! (Check terminal console)' : '✉️ Verification OTP sent to your Gmail inbox!');
    } catch(err) {
      const errEl = document.getElementById('otpSendError');
      if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Send 6-Digit OTP ➔'; }
    }
  };

  window.verifyOtpRequest = async function() {
    const boxes = document.querySelectorAll('.otp-digit-box');
    let code = '';
    boxes.forEach(b => code += b.value.trim());

    if (code.length !== 6) {
      const err = document.getElementById('otpVerifyError');
      if (err) { err.textContent = 'Please enter the complete 6-digit OTP.'; err.style.display = 'block'; }
      return;
    }

    const btn = document.getElementById('btnVerifyOtp');
    if (btn) { btn.disabled = true; btn.textContent = 'Verifying...'; }

    try {
      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: targetEmail, otp: code })
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Invalid OTP');
      }

      closeModal();
      toast('🎉 Email verified successfully with Gmail OTP!');
      if (data.user) {
        STATE.isAuthenticated = true;
        STATE.currentUser = data.user;
        saveState();
        render();
      }
    } catch(err) {
      const errEl = document.getElementById('otpVerifyError');
      if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Verify & Authenticate ➔'; }
    }
  };

  function setupOtpInputHandlers() {
    const boxes = document.querySelectorAll('.otp-digit-box');
    boxes.forEach((box, idx) => {
      box.addEventListener('input', (e) => {
        const val = e.target.value;
        if (!/^\d*$/.test(val)) { e.target.value = ''; return; }
        if (val && idx < 5) {
          boxes[idx + 1].focus();
        }
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          boxes[idx - 1].focus();
        }
      });
      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (/^\d{6}$/.test(pasted)) {
          pasted.split('').forEach((digit, i) => {
            if (boxes[i]) boxes[i].value = digit;
          });
          boxes[5].focus();
        }
      });
    });
    if (boxes[0]) boxes[0].focus();
  }

  function startCooldown(seconds) {
    cooldown = seconds;
    const textEl = document.getElementById('otpCooldownText');
    const resendBtn = document.getElementById('btnResendOtp');
    if (countdownTimer) clearInterval(countdownTimer);

    countdownTimer = setInterval(() => {
      cooldown--;
      if (cooldown <= 0) {
        clearInterval(countdownTimer);
        if (textEl) textEl.style.display = 'none';
        if (resendBtn) resendBtn.style.display = 'inline';
      } else {
        if (textEl) { textEl.textContent = `Resend in ${cooldown}s`; textEl.style.display = 'inline'; }
        if (resendBtn) resendBtn.style.display = 'none';
      }
    }, 1000);
  }

  showModal(renderOtpStep1(), 460);
}
window.openOtpVerificationModal = openOtpVerificationModal;

/* ================= KEYBOARD SHORTCUTS & INIT ================= */
window.addEventListener('keydown', (e) => {
  // Global search: Ctrl/Cmd + K
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const s = document.getElementById('globalSearch');
    if (s) { s.focus(); s.select(); }
  }
  // Record payment: Ctrl/Cmd + Shift + P
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'p') {
    e.preventDefault();
    openPaymentModal();
  }
  // Log expense: Ctrl/Cmd + Shift + E
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    openExpenseModal();
  }
  // New client: Ctrl/Cmd + Shift + C
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    openNewClientModal();
  }
  // Navigate back: Alt + ArrowLeft
  if (e.altKey && e.key === 'ArrowLeft') {
    e.preventDefault();
    navigateBack();
  }
  // Close modals & dropdowns: Escape
  if (e.key === 'Escape') {
    closeModal();
    closeDropdownMenu();
  }
});

function openDropdownMenu() {
  const menu = document.getElementById('topbarDropdownMenu');
  const trigger = document.getElementById('topbarProfileTrigger');
  const backdrop = document.getElementById('dropdownBackdrop');
  if (menu) menu.classList.add('show');
  if (trigger) trigger.classList.add('active');
  if (backdrop) backdrop.classList.add('show');
}
window.openDropdownMenu = openDropdownMenu;

function closeDropdownMenu() {
  const menu = document.getElementById('topbarDropdownMenu');
  const trigger = document.getElementById('topbarProfileTrigger');
  const backdrop = document.getElementById('dropdownBackdrop');
  if (menu) menu.classList.remove('show');
  if (trigger) trigger.classList.remove('active');
  if (backdrop) backdrop.classList.remove('show');
}
window.closeDropdownMenu = closeDropdownMenu;

function toggleDropdownMenu(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const menu = document.getElementById('topbarDropdownMenu');
  if (menu && menu.classList.contains('show')) {
    closeDropdownMenu();
  } else {
    openDropdownMenu();
  }
}
window.toggleDropdownMenu = toggleDropdownMenu;

['click', 'touchstart', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, (e) => {
    const menu = document.getElementById('topbarDropdownMenu');
    const trigger = document.getElementById('topbarProfileTrigger');
    if (menu && menu.classList.contains('show')) {
      if (trigger && trigger.contains(e.target)) return;
      if (!menu.contains(e.target)) {
        closeDropdownMenu();
      }
    }
  }, { passive: true });
});

(async function() {
  await loadState();
  render();
})();
</script>
</body>
