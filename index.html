<style>
/* ================= OFFICIAL EXECUTIVE PALETTE & THEME ENGINE ================= */
:root, [data-theme="dark"] {
  /* Twilight Slate & Rose (Dark Mode - Palette Matched) */
  --bg-app: #171726;
  --bg-sidebar: #1d1d2f;
  --bg-card: #22223b;
  --bg-card-hover: #2a2a46;
  --bg-elevated: #2d2d4c;
  --bg-subtle: #1a1a2b;
  
  --text-primary: #f2e9e4;
  --text-secondary: #c9ada7;
  --text-muted: #9a8c98;
  --text-faint: #6d6477;
  
  --border-subtle: rgba(154, 140, 152, 0.18);
  --border-card: rgba(201, 173, 167, 0.22);
  --border-focus: #c9ada7;

  /* Official Brand & Accents */
  --brand: #9a8c98;
  --brand-light: #c9ada7;
  --brand-dark: #4a4e69;
  --brand-gradient: linear-gradient(135deg, #4a4e69 0%, #9a8c98 100%);
  --brand-soft: rgba(154, 140, 152, 0.18);
  --brand-glow: rgba(154, 140, 152, 0.32);

  /* Financial Accents */
  --signal-cash: #48b388;
  --signal-cash-glow: rgba(72, 179, 136, 0.28);
  --signal-soft: rgba(72, 179, 136, 0.14);
  --accent-cyan: #5da8c6;
  --accent-cyan-soft: rgba(93, 168, 198, 0.14);
  --accent-amber: #e29b63;
  --accent-amber-soft: rgba(226, 155, 99, 0.14);
  --accent-rose: #e06d85;
  --accent-rose-soft: rgba(224, 109, 133, 0.14);

  /* Hero & Surface Specifics */
  --hero-bg: linear-gradient(135deg, #1a1a2b 0%, #22223b 50%, #302b48 100%);
  --hero-border: rgba(201, 173, 167, 0.28);
  --hero-title-color: #f2e9e4;
  --hero-sub-color: #c9ada7;
  --hero-stat-text: #9a8c98;
  --hero-stat-val: #f2e9e4;
  --hero-decor-1: rgba(201, 173, 167, 0.2);
  --hero-decor-2: rgba(74, 78, 105, 0.35);

  --sidebar-hover-bg: rgba(201, 173, 167, 0.1);
  --sidebar-hover-text: #f2e9e4;
  --overlay-bg: rgba(19, 19, 32, 0.82);
  --toast-bg: #2a2a46;
  --toast-text: #f2e9e4;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  --shadow-sm: 0 2px 8px rgba(10, 10, 18, 0.4);
  --shadow-md: 0 8px 24px rgba(10, 10, 18, 0.55);
  --shadow-lg: 0 16px 48px rgba(10, 10, 18, 0.75);
}

/* Complete Official Light Theme with Requested Palette */
[data-theme="light"] {
  --bg-app: #f2e9e4;
  --bg-sidebar: #ffffff;          /* Clean white light sidebar */
  --bg-card: #ffffff;
  --bg-card-hover: #faf6f4;
  --bg-elevated: #ffffff;
  --bg-subtle: #e8ded8;

  --text-primary: #22223b;
  --text-secondary: #4a4e69;
  --text-muted: #9a8c98;
  --text-faint: #c9ada7;

  --border-subtle: #e2d7d2;
  --border-card: #ded0ca;
  --border-focus: #4a4e69;

  --brand: #4a4e69;
  --brand-light: #9a8c98;
  --brand-dark: #22223b;
  --brand-soft: rgba(74, 78, 105, 0.12);
  --brand-glow: rgba(74, 78, 105, 0.22);
  --brand-gradient: linear-gradient(135deg, #22223b 0%, #4a4e69 100%);

  --signal-cash: #2d6a4f;
  --signal-cash-glow: rgba(45, 106, 79, 0.18);
  --signal-soft: rgba(45, 106, 79, 0.12);
  --accent-cyan: #3b7a8c;
  --accent-cyan-soft: rgba(59, 122, 140, 0.12);
  --accent-amber: #b97a44;
  --accent-amber-soft: rgba(185, 122, 68, 0.14);
  --accent-rose: #a84e62;
  --accent-rose-soft: rgba(168, 78, 98, 0.12);

  /* Hero & Surface Specifics */
  --hero-bg: linear-gradient(135deg, #ffffff 0%, #f7f1ee 50%, #ede2dc 100%);
  --hero-border: rgba(201, 173, 167, 0.55);
  --hero-title-color: #22223b;
  --hero-sub-color: #4a4e69;
  --hero-stat-text: #4a4e69;
  --hero-stat-val: #22223b;
  --hero-decor-1: rgba(201, 173, 167, 0.35);
  --hero-decor-2: rgba(74, 78, 105, 0.16);

  --sidebar-hover-bg: rgba(74, 78, 105, 0.07);
  --sidebar-hover-text: #22223b;
  --overlay-bg: rgba(34, 34, 59, 0.48);
  --toast-bg: #22223b;
  --toast-text: #f2e9e4;

  --shadow-sm: 0 1px 3px rgba(34, 34, 59, 0.06);
  --shadow-md: 0 4px 18px rgba(34, 34, 59, 0.08);
  --shadow-lg: 0 12px 36px rgba(34, 34, 59, 0.13);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-app);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  transition: background-color 0.2s ease, color 0.2s ease;
}
h1, h2, h3, h4, .display-font { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; font-weight: 700; color: var(--text-primary); }
.mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "zero" 1; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ================= APP SHELL LAYOUT ================= */
#app { display: flex; min-height: 100vh; background: var(--bg-app); position: relative; }
.main-content-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
main { flex: 1; padding: 26px 36px 80px 36px; max-width: 1400px; width: 100%; margin: 0 auto; }

/* Sidebar */
.sidebar {
  width: 255px; background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);
  color: var(--text-primary); flex-shrink: 0; display: flex; flex-direction: column; padding: 22px 14px;
  position: sticky; top: 0; height: 100vh; z-index: 40; transition: transform 0.25s ease, background 0.2s ease;
}
.brand-badge {
  padding: 0 8px 20px 8px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 18px;
  display: flex; align-items: center; gap: 12px;
}
.brand-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-icon svg { width: 100%; height: 100%; display: block; }
.brand-title { font-size: 17.5px; font-weight: 800; letter-spacing: 0.2px; color: var(--text-primary); font-family: 'Space Grotesk', sans-serif; }
.brand-tagline { font-size: 10.5px; color: var(--signal-cash); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 1px; }

.nav-section { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 13px; border-radius: 9px;
  color: var(--text-secondary); font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: all 0.15s ease; user-select: none; position: relative;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-muted); }
.nav-item:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-hover-text); }
.nav-item:hover svg { color: var(--sidebar-hover-text); }
.nav-item.active { background: var(--brand); color: #ffffff; box-shadow: 0 4px 16px var(--brand-glow); }
.nav-item.active svg { color: #ffffff; }
.nav-counter { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
.nav-item.active .nav-counter { background: rgba(255, 255, 255, 0.25); color: #ffffff; border-color: transparent; }

.sidebar-footer { padding-top: 14px; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 10px; }
.owner-pill { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 9px; overflow: hidden; }
.owner-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; overflow: hidden; flex-shrink: 0; }
.owner-info { font-size: 12px; line-height: 1.2; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.owner-info b { color: var(--text-primary); display: block; overflow: hidden; text-overflow: ellipsis; }
.owner-info span { color: var(--text-muted); font-size: 10.5px; }

/* Topbar */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 36px; background: var(--bg-card); border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; z-index: 30; backdrop-filter: blur(14px);
}
.topbar-left { display: flex; align-items: center; gap: 16px; flex: 1; }
.pulse-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
  border-radius: 99px; background: var(--signal-soft); border: 1px solid rgba(16, 185, 129, 0.25);
  font-size: 11px; font-weight: 700; color: var(--signal-cash); text-transform: uppercase; letter-spacing: 0.4px;
}
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal-cash); box-shadow: 0 0 8px var(--signal-cash); }

.search-bar {
  display: flex; align-items: center; gap: 10px; background: var(--bg-subtle);
  border: 1px solid var(--border-subtle); border-radius: 9px; padding: 7px 13px;
  width: 100%; max-width: 420px; transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-bar:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--brand-soft); }
.search-bar svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
.search-bar input { border: none; background: transparent; outline: none; color: var(--text-primary); font-size: 13px; width: 100%; }
.cmd-shortcut { font-size: 10px; font-family: 'JetBrains Mono', monospace; background: var(--bg-card); color: var(--text-muted); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border-subtle); }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ================= EXECUTIVE PROFILE & ACTIONS DROPDOWN ================= */
.dropdown-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(2px);
  z-index: 140;
  -webkit-tap-highlight-color: transparent;
}
.dropdown-backdrop.show {
  display: block;
}

.profile-dropdown-wrapper {
  position: relative;
  display: inline-block;
  z-index: 145;
}
.profile-trigger {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  border-radius: 9px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.15s ease;
  user-select: none;
  touch-action: manipulation;
}
.profile-trigger:hover, .profile-trigger.active {
  background: var(--bg-elevated);
  border-color: var(--border-focus);
}
.profile-caret {
  font-size: 8px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
  margin-left: 2px;
}
.profile-trigger.active .profile-caret {
  transform: rotate(180deg);
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 310px;
  max-width: calc(100vw - 24px);
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 14px;
  box-shadow: var(--shadow-lg), 0 20px 40px rgba(0, 0, 0, 0.45);
  padding: 8px;
  z-index: 150;
  display: none;
  flex-direction: column;
  gap: 3px;
  backdrop-filter: blur(16px);
  animation: dropdownFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
.dropdown-menu.show {
  display: flex;
}

@media (max-width: 640px) {
  .dropdown-menu {
    position: fixed !important;
    top: 56px !important;
    right: 10px !important;
    left: 10px !important;
    width: auto !important;
    max-width: 340px !important;
    margin-left: auto !important;
    z-index: 99999 !important;
  }
}

@keyframes dropdownFadeIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dropdown-header {
  padding: 12px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  margin-bottom: 4px;
}
.dropdown-header-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dropdown-header-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  line-height: 1;
  flex-shrink: 0;
}
.dropdown-header-name {
  font-weight: 800;
  font-size: 13.5px;
  color: var(--text-primary);
  line-height: 1.2;
}
.dropdown-header-email {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.12s ease;
  user-select: none;
}
.dropdown-item:hover {
  background: var(--bg-subtle);
  color: var(--brand-light);
}
.dropdown-item-left {
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
}
.dropdown-divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 4px 6px;
}
.dropdown-item-danger {
  color: var(--accent-rose);
}
.dropdown-item-danger:hover {
  background: var(--accent-rose-soft);
  color: var(--accent-rose);
}

/* Floating Action Button (FAB) */
.fab {
  position: fixed !important;
  bottom: 24px !important;
  right: 20px !important;
  width: 52px !important;
  height: 52px !important;
  min-width: 52px !important;
  max-width: 52px !important;
  min-height: 52px !important;
  max-height: 52px !important;
  aspect-ratio: 1 / 1 !important;
  border-radius: 50% !important;
  background: var(--brand) !important;
  color: #ffffff !important;
  display: none;
  align-items: center !important;
  justify-content: center !important;
  box-shadow: 0 8px 24px var(--brand-glow), 0 4px 12px rgba(0, 0, 0, 0.3) !important;
  cursor: pointer;
  z-index: 9999 !important;
  border: none !important;
  transition: transform 0.12s ease !important;
  font-size: 22px !important;
  flex: none !important;
  line-height: 1 !important;
  padding: 0 !important;
  margin: 0 !important;
  overflow: hidden !important;
}
.fab:active {
  transform: scale(0.92) !important;
}

/* Buttons */
.btn {
  border: none; border-radius: 9px; padding: 8px 15px; font-weight: 600; font-size: 13px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; transition: all 0.12s ease; user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--brand-gradient); color: #fff; box-shadow: 0 4px 14px var(--brand-glow); }
.btn-primary:hover { opacity: 0.94; }
.btn-signal { background: var(--signal-cash); color: #ffffff; font-weight: 700; box-shadow: 0 4px 14px var(--signal-cash-glow); }
.btn-signal:hover { opacity: 0.92; }
.btn-ghost { background: var(--bg-subtle); color: var(--text-primary); border: 1px solid var(--border-subtle); }
.btn-ghost:hover { background: var(--bg-elevated); border-color: var(--border-focus); }
.btn-danger-ghost { background: var(--accent-rose-soft); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.2); }
.btn-danger-ghost:hover { background: var(--accent-rose); color: #fff; }
.btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 7px; }
.btn-icon {
  padding: 8px; border-radius: 9px; background: var(--bg-subtle); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: var(--bg-elevated); color: var(--text-primary); }
.wa-btn {
  background: #25d366; color: #fff; border: none; border-radius: 7px;
  padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.15s ease;
}
.wa-btn:hover { opacity: 0.92; }

/* Grid & Cards */
.grid { display: grid; gap: 16px; margin-bottom: 24px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.card {
  background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius);
  padding: 20px 22px; box-shadow: var(--shadow-sm); position: relative;
}
.card-title { font-size: 14.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.stat-label { font-size: 11.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); }
.stat-value.small { font-size: 19px; }
.stat-value.good { color: var(--signal-cash); }
.stat-value.danger { color: var(--accent-rose); }
.stat-value.amber { color: var(--accent-amber); }
.stat-footer { margin-top: 8px; font-size: 12px; color: var(--text-muted); }

/* Executive Hero Banner (Adapts Light/Dark) */
.hero-earnings {
  background: var(--hero-bg);
  border: 1px solid var(--hero-border); border-radius: var(--radius-lg);
  padding: 28px 32px; color: var(--hero-title-color); margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: var(--shadow-md);
}
.hero-earnings::before {
  content: ""; position: absolute; right: -40px; top: -40px; width: 240px; height: 240px;
  border-radius: 50%; background: radial-gradient(circle, var(--hero-decor-1), transparent 70%); pointer-events: none;
}
.hero-earnings::after {
  content: ""; position: absolute; left: 30%; bottom: -50px; width: 200px; height: 200px;
  border-radius: 50%; background: radial-gradient(circle, var(--hero-decor-2), transparent 70%); pointer-events: none;
}
.hero-label { font-size: 11.5px; color: var(--signal-cash); font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; }
.hero-value { font-size: 44px; font-weight: 800; color: var(--signal-cash); margin: 6px 0 4px 0; font-family: 'Space Grotesk', sans-serif; text-shadow: 0 0 24px var(--signal-cash-glow); }
.hero-sub { font-size: 13px; color: var(--hero-sub-color); max-width: 650px; }
.hero-stats-row { display: flex; gap: 34px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
.hero-stat-item { font-size: 11.5px; color: var(--hero-stat-text); text-transform: uppercase; letter-spacing: 0.5px; }
.hero-stat-item b { display: block; color: var(--hero-stat-val); font-size: 18px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; font-weight: 700; }

/* Interactive Simulator Widget */
.simulator-box {
  background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius);
  padding: 18px 22px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
}
.slider-range {
  width: 100%; height: 6px; border-radius: 5px; background: var(--border-subtle);
  outline: none; -webkit-appearance: none; margin: 12px 0 6px 0;
}
.slider-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--brand); cursor: pointer; box-shadow: 0 0 10px var(--brand-glow);
}

/* Tables */
.table-wrap { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; padding: 12px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
td { padding: 13px 16px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; color: var(--text-primary); }
tr:last-child td { border-bottom: none; }
.row-click { cursor: pointer; transition: background 0.1s ease; }
.row-click:hover td { background: var(--bg-card-hover); }

/* Badges & Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
.pill-green { background: var(--signal-soft); color: var(--signal-cash); border: 1px solid rgba(16, 185, 129, 0.25); }
.pill-amber { background: var(--accent-amber-soft); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.25); }
.pill-red { background: var(--accent-rose-soft); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.25); }
.pill-brand { background: var(--brand-soft); color: var(--brand-light); border: 1px solid rgba(99, 102, 241, 0.25); }
.pill-cyan { background: var(--accent-cyan-soft); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.25); }
.pill-gray { background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.tab { padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s ease; white-space: nowrap; user-select: none; }
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }

/* Kanban */
.kanban-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; min-height: 520px; }
.kanban-column { flex: 0 0 290px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius); display: flex; flex-direction: column; max-height: 720px; }
.kanban-header { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; justify-content: space-between; background: var(--bg-subtle); border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
.kanban-cards-wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
.kanban-card { background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 12px 14px; cursor: pointer; transition: transform 0.1s ease, border-color 0.15s ease; }
.kanban-card:hover { transform: translateY(-2px); border-color: var(--brand); }
.kanban-card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
.kanban-card-client { font-size: 11.5px; color: var(--brand); margin-bottom: 8px; font-weight: 600; }
.kanban-card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle); }

/* Modals */
.overlay { position: fixed; inset: 0; background: var(--overlay-bg); backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 100; overflow-y: auto; }
.overlay.open { display: flex; }
.modal { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-lg); width: 100%; max-width: 560px; padding: 26px 28px; box-shadow: var(--shadow-lg); position: relative; color: var(--text-primary); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 16px; }
.modal-close:hover { color: var(--text-primary); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 12px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 13.5px; color: var(--text-primary); outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--border-focus); }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }

/* Quick Add */
.quickadd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
.qa-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--text-primary); transition: all 0.15s ease; user-select: none; }
.qa-card:hover { background: var(--brand-soft); border-color: var(--brand); transform: translateY(-2px); color: var(--brand); }

/* Toast */
#toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--toast-bg); border: 1px solid var(--border-card); color: var(--toast-text); padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-md); opacity: 0; transition: all 0.22s ease; z-index: 200; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.notif-dot { position: absolute; top: -4px; right: -4px; background: var(--accent-rose); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 99px; min-width: 17px; text-align: center; }
.empty { padding: 42px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

/* ================= ADVANCED RESPONSIVE & MOBILE ERGONOMICS ================= */
button, .btn, .qa-card, .tab, .kanban-card {

<!-- Supabase JS Client & Fullstack API Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= GLOBAL UTILITIES & FORMATTERS ================= */
const uid = (p = 'ax') => `${p}_${Math.random().toString(36).slice(2, 9)}_${Date.now().toString(36)}`;
const todayStr = () => new Date().toISOString().slice(0, 10);
const currentYM = () => todayStr().slice(0, 7);
const fmtMoney = (n, sym = '₹') => `${sym}${(Number(n) || 0).toLocaleString('en-IN')}`;
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtMonthYear = (ym) => {
  if (!ym) return '—';
  const [y, m] = ym.split('-');
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
};
const daysBetween = (a, b) => (a && b) ? Math.round((new Date(b) - new Date(a)) / 86400000) : 0;
const addMonths = (dateStr, n = 1) => {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
};
const sanitizePhone = (p) => {
  let clean = (p || '').replace(/[^0-9]/g, '');
  if (clean.length === 10) clean = '91' + clean;
  return clean;
};
const esc = (s) => (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderAvatar(avatar, size = 26, fallback = '👤') {
  if (!avatar) return `<span style="font-size:${Math.round(size * 0.75)}px; line-height:1;">${fallback}</span>`;
  if (typeof avatar === 'string' && (avatar.startsWith('http://') || avatar.startsWith('https://') || avatar.startsWith('data:'))) {
    return `<img src="${avatar}" alt="Avatar" style="width:${size}px; height:${size}px; border-radius:50%; object-fit:cover; display:inline-block; vertical-align:middle; border:1px solid rgba(255,255,255,0.15);" onerror="this.outerHTML='<span style=\\'font-size:${Math.round(size * 0.75)}px;\\'>${fallback}</span>'" />`;
  }
  return `<span style="font-size:${Math.round(size * 0.75)}px; line-height:1;">${avatar}</span>`;
}
window.renderAvatar = renderAvatar;

/* ================= WHATSAPP ENGINE ================= */
function buildWaLink(phone, message) {
  return `https://wa.me/${sanitizePhone(phone)}?text=${encodeURIComponent(message)}`;
}
function sendWa(phone, message) {
  if (!phone) { alert('No mobile number provided for this contact.'); return; }
  window.open(buildWaLink(phone, message), '_blank');
}

const WA_TEMPLATES = {
  paymentThanks(name, amount, date, pending, agency = 'AccountiX') {
    let msg = `Hi ${name},\n\nThank you for your payment of *${fmtMoney(amount)}* received on ${fmtDate(date)}.\n`;
    if (pending > 0) msg += `Remaining balance: *${fmtMoney(pending)}*.\n\n`;
    else msg += `Your account is fully paid up. Thank you for your partnership!\n\n`;
    msg += `Warm regards,\n*${agency}*`;
    return msg;
  },
  outstanding(name, pending, due, agency = 'AccountiX') {
    return `Hi ${name},\n\nThis is a gentle payment reminder from *${agency}*.\n\nAn outstanding balance of *${fmtMoney(pending)}* is pending on your account${due ? ` (Due date: ${fmtDate(due)})` : ''}.\n\nKindly clear this payment at your earliest convenience. Thank you!`;
  },
  multiRenewal(name, packagesList, totalAmount, dueEndDate, agency = 'AccountiX') {
    let msg = `Hi ${name},\n\nYour retainer package(s) with *${agency}* are due for renewal on *${fmtDate(dueEndDate)}*:\n\n`;
    packagesList.forEach(p => {
      msg += `• *${p.serviceType}*: ${fmtMoney(p.amount)}\n`;
    });
    msg += `\n*Total Renewal Amount: ${fmtMoney(totalAmount)}*\n\nPlease confirm payment to renew for the next cycle without any gap in marketing & content delivery.\n\nThank you!`;
    return msg;
  },
  approval(name, type, topic, link, agency = 'AccountiX') {
    let msg = `Hi ${name},\n\nYour new *${type}* ("${topic || 'Deliverable'}") is ready for your review!\n\n`;
    if (link) msg += `Preview Link: ${link}\n\n`;
    msg += `Please reply with your approval or any revision notes.\n\nBest,\n*${agency}*`;
    return msg;
  },
  followUp(name, service, agency = 'AccountiX') {
    return `Hi ${name},\n\nFollowing up on our conversation regarding *${service || 'our growth marketing services'}* with *${agency}*.\n\nWould you be available for a brief catchup this week?\n\nBest regards,\n*${agency}*`;
  }
};

/* ================= MULTI-PROFESSION & INDUSTRY SERVICE CONFIGS ================= */
const INDUSTRY_CONFIGS = {
  ca: {
    id: 'ca',
    name: 'Chartered Accountant (CA), Tax & Audit Advisory',
    shortName: 'CA & Tax Advisory',
    icon: '📊',
    tagline: 'Financial Advisory, Tax Compliance & Audit Operating System',
    clientTerm: 'Client Accounts & Corporates',
    serviceTerm: 'Audit & Compliance Retainers',
    deliverableTerm: 'Tax Filings & Audit Reports',
    teamTerm: 'Tax Associates & Article Trainees',

/* ================= 💎 BESPOKE METROVISE BRAND LOGO ENGINE ================= */
function renderMetroviseLogoSvg(size = 38, variant = 'brand') {
  const gId1 = `mvG1_${Math.random().toString(36).substr(2, 5)}`;
  const gId2 = `mvG2_${Math.random().toString(36).substr(2, 5)}`;
  
  let col1Start = '#c9ada7', col1End = '#9a8c98';
  let col2Start = '#4a4e69', col2End = '#22223b';
  let badgeBorder = 'rgba(201,173,167,0.35)';

  if (variant === 'admin') {
    col1Start = '#c084fc'; col1End = '#7c3aed';
    col2Start = '#f472b6'; col2End = '#db2777';
    badgeBorder = 'rgba(168,85,247,0.4)';
  } else if (variant === 'employee') {
    col1Start = '#34d399'; col1End = '#059669';
    col2Start = '#38bdf8'; col2End = '#0284c7';
    badgeBorder = 'rgba(16,185,129,0.4)';
  }

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius:12px; flex-shrink:0; vertical-align:middle; display:inline-block;">
      <defs>
        <linearGradient id="${gId1}" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="${col1Start}"/>
          <stop offset="100%" stop-color="${col1End}"/>
        </linearGradient>
        <linearGradient id="${gId2}" x1="48" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="${col2Start}"/>
          <stop offset="100%" stop-color="${col2End}"/>
        </linearGradient>
      </defs>
      <!-- Base Shield Plate -->
      <rect width="48" height="48" rx="12" fill="#22223b"/>

function getSupabaseCreds() {
  return {
    url: (localStorage.getItem(SUPABASE_URL_KEY) || '').trim(),
    key: (localStorage.getItem(SUPABASE_ANON_KEY) || '').trim()
  };
}

function setSupabaseCreds(url, key) {
  localStorage.setItem(SUPABASE_URL_KEY, (url || '').trim());
  localStorage.setItem(SUPABASE_ANON_KEY, (key || '').trim());
  initSupabaseClient();
}

function initSupabaseClient() {
  const { url, key } = getSupabaseCreds();
  if (url && key && window.supabase && typeof window.supabase.createClient === 'function') {
    try {
      _supabaseClient = window.supabase.createClient(url, key, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      // Setup Supabase Auth state change listener (Restores session, Login, Account switch)
      if (_supabaseClient.auth && !_sbAuthSubscription) {
        const { data: { subscription } } = _supabaseClient.auth.onAuthStateChange(async (event, session) => {
          console.log('⚡ Supabase Auth Event:', event);
          if (session && session.user) {
            const sbUser = session.user;
            const cleanEmail = (sbUser.email || '').toLowerCase().trim();
            const isSuperAdminEmail = cleanEmail === 'jeetrakholiya02@gmail.com' || cleanEmail === 'jeetrakholiya@gmail.com';
            
            STATE.currentUser = {
              id: sbUser.id,
              email: sbUser.email,
              name: (sbUser.user_metadata && sbUser.user_metadata.name) || sbUser.email.split('@')[0],
              role: isSuperAdminEmail ? 'admin' : ((sbUser.user_metadata && sbUser.user_metadata.role) || 'manager'),
              isSuperAdmin: isSuperAdminEmail,
              avatar: (sbUser.user_metadata && sbUser.user_metadata.avatar_url) || (isSuperAdminEmail ? '👑' : '🏢'),
              companyName: STATE.settings ? STATE.settings.agencyName : 'AccountiX Media HQ'
            };
            STATE.isAuthenticated = true;
            if (isSuperAdminEmail) {
              STATE.activePanel = 'admin';
              STATE.view = 'admin_overview';
            }
            await syncFromSupabase();
            hideSessionLoading();
            render();
          } else if (event === 'SIGNED_OUT') {
            hideSessionLoading();
          }
        });
        _sbAuthSubscription = subscription;
      }

      return _supabaseClient;
    } catch (e) {
      console.warn('Supabase init failed', e);
      _supabaseClient = null;
    }
  }
  _supabaseClient = null;
  return null;
}

function isSupabaseConnected() {
  if (!_supabaseClient) initSupabaseClient();
  return !!_supabaseClient;
}

async function testSupabaseConnection() {
  if (!_supabaseClient) initSupabaseClient();
  if (!_supabaseClient) return { success: false, error: 'Missing Supabase URL or Anon Key' };
  try {
    const { data, error } = await _supabaseClient.from('user_data').select('id').limit(1);
    if (error && error.code !== 'PGRST116') {
      const fallback = await _supabaseClient.from('accountix_settings').select('id').limit(1);
      if (fallback.error) return { success: false, error: fallback.error.message };
    }

  }
}

async function fetchUserDataFromSupabase(showToast = false) {
  if (!_supabaseClient) initSupabaseClient();
  if (!_supabaseClient) return STATE.userData || [];
  try {
    const { data: { user } } = await _supabaseClient.auth.getUser();
    if (!user) return STATE.userData || [];

    const { data, error } = await _supabaseClient
      .from('user_data')
      .select('*')
      .order('created_at', { ascending: false });

    if (!error && data) {
      STATE.userData = data;
      saveLocalState();
      if (showToast) toast(`✓ Refreshed ${data.length} records from Supabase PostgreSQL`);
      renderMain();
    } else if (error) {
      console.warn('user_data fetch note:', error.message);
    }
    return STATE.userData;
  } catch (e) {
    return STATE.userData || [];
  }
}

async function insertUserDataRecord(title, content) {
  if (!_supabaseClient) initSupabaseClient();
  
  if (!_supabaseClient) {
    const localRec = {
      id: uid('ud'),
      title: title || '',
      content: content || '',
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    if (!STATE.userData) STATE.userData = [];
    STATE.userData.unshift(localRec);
    saveState();
    renderMain();
    toast('✓ Saved locally (Connect Supabase to store in cloud)');
    return localRec;
  }

  try {
    const { data: { user }, error: userErr } = await _supabaseClient.auth.getUser();
    if (!user || userErr) {
      toast('❌ Please sign in to Supabase to insert persistent data');
      return null;
    }

    const { data, error } = await _supabaseClient
      .from('user_data')
      .insert({
        user_id: user.id,
        title: title || '',
        content: content || '',
        updated_at: new Date().toISOString()
      })
      .select();

    if (error) {
      toast('❌ Supabase error: ' + error.message);
      return null;
    }

    const saved = data ? data[0] : null;
    if (saved) {
      if (!STATE.userData) STATE.userData = [];
      STATE.userData.unshift(saved);
      saveLocalState();
      renderMain();
      toast('✓ Permanently saved in Supabase PostgreSQL!');

async function updateUserDataRecord(recordId, title, content) {
  if (!_supabaseClient) initSupabaseClient();

  if (!_supabaseClient) {
    const item = (STATE.userData || []).find(d => d.id === recordId);
    if (item) {
      item.title = title;
      item.content = content;
      item.updated_at = new Date().toISOString();
      saveState();
      renderMain();
      toast('✓ Updated locally');
    }
    return;
  }

  try {
    const { data, error } = await _supabaseClient
      .from('user_data')
      .update({
        title,
        content,
        updated_at: new Date().toISOString()
      })
      .eq('id', recordId)
      .select();

    if (error) {
      toast('❌ Supabase error: ' + error.message);
      return;
    }

    const idx = (STATE.userData || []).findIndex(d => d.id === recordId);
    if (idx !== -1 && data && data[0]) {
      STATE.userData[idx] = data[0];
      saveLocalState();
      renderMain();
      toast('✓ Record updated in Supabase PostgreSQL!');
    }
  } catch (err) {
    console.error('Update user_data error:', err);

  }

async function deleteUserDataRecord(recordId) {
  if (!_supabaseClient) initSupabaseClient();

  if (!_supabaseClient) {
    STATE.userData = (STATE.userData || []).filter(d => d.id !== recordId);
    saveState();
    renderMain();
    toast('✓ Deleted locally');
    return;

  try {
    const { error } = await _supabaseClient
      .from('user_data')
      .delete()
      .eq('id', recordId);

    if (error) {
      toast('❌ Supabase error: ' + error.message);

    STATE.userData = (STATE.userData || []).filter(d => d.id !== recordId);

    renderMain();
    toast('✓ Record permanently deleted from Supabase PostgreSQL');

/* ================= GLOBAL JWT AUTH & MULTI-TENANT WORKSPACE API CLIENT ================= */
const JWT_STORAGE_KEY = 'metrovise_jwt_token';

var Metrovise_API = {
  getToken() {
    return localStorage.getItem(JWT_STORAGE_KEY) || '';
  },
  setToken(token) {
    if (token) localStorage.setItem(JWT_STORAGE_KEY, token);
    else localStorage.removeItem(JWT_STORAGE_KEY);
  },
  getHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    const token = this.getToken();
    if (token) headers['Authorization'] = `Bearer ${token}`;
    return headers;
  },
  async login(email, password, role) {
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role })
      });
      const data = await res.json();

async function loadState() {
  try {
    let raw = null;
    const token = Metrovise_API.getToken() || (window.AccountiX_API && typeof window.AccountiX_API.getToken === 'function' ? window.AccountiX_API.getToken() : '');
    if (token) {
      try {
        const parts = token.split('.');
        if (parts.length === 3) {
          const payload = JSON.parse(atob(parts[1]));
          if (payload && payload.email) {
            const cleanEm = payload.email.toLowerCase().trim();
            raw = localStorage.getItem('metrovise_state_' + cleanEm) || localStorage.getItem('accountix_state_' + cleanEm);
          }
        }
      } catch(e) {}
    }
    if (!raw) {
      raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('accountix_os_data_v1');
    }
    if (raw) {
      Object.assign(STATE, JSON.parse(raw));
    }
  } catch (e) {
    console.warn('Load state notice:', e);
  }

  // Handle URL Query Parameters (e.g. Employee Invite link clicked from Email)
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const urlRole = urlParams.get('role');
    const urlEmail = urlParams.get('email');
    const urlAuth = urlParams.get('auth');

    if (urlRole === 'employee' || (urlEmail && urlAuth === 'login')) {
      window._incomingInviteEmail = urlEmail ? decodeURIComponent(urlEmail).trim() : '';
      window._incomingRole = 'employee';
      window._authFormMode = 'login';

      // Always reset active session so the staff member can authenticate cleanly
      STATE.isAuthenticated = false;
      STATE.currentUser = null;
    }
  } catch (e) {
    console.warn('URL params parse note:', e);
  }

  // 1. Fetch global Supabase configuration from server (Cross-Device Cloud Sync)
  try {
    const sbConfigRes = await fetch('/api/config/supabase').then(r => r.json()).catch(() => null);
    if (sbConfigRes && sbConfigRes.connected && sbConfigRes.url && sbConfigRes.anonKey) {
      const currentCreds = getSupabaseCreds();
      if (!currentCreds.url || currentCreds.url !== sbConfigRes.url) {
        setSupabaseCreds(sbConfigRes.url, sbConfigRes.anonKey);
      }
    }
  } catch (e) {
    console.warn('Supabase config fetch note:', e);
  }

  // 2. Fetch server database state for cross-device accounts
  try {
    const stateRes = await fetch('/api/state').then(r => r.json()).catch(() => null);
    if (stateRes) {
      if (Array.isArray(stateRes.clients) && stateRes.clients.length && (!STATE.clients || !STATE.clients.length)) STATE.clients = stateRes.clients;
      if (Array.isArray(stateRes.packages) && stateRes.packages.length && (!STATE.packages || !STATE.packages.length)) STATE.packages = stateRes.packages;
      if (Array.isArray(stateRes.payments) && stateRes.payments.length && (!STATE.payments || !STATE.payments.length)) STATE.payments = stateRes.payments;
      if (Array.isArray(stateRes.expenses) && stateRes.expenses.length && (!STATE.expenses || !STATE.expenses.length)) STATE.expenses = stateRes.expenses;
      if (Array.isArray(stateRes.staff) && stateRes.staff.length && (!STATE.staff || !STATE.staff.length)) STATE.staff = stateRes.staff;
      if (Array.isArray(stateRes.tasks) && stateRes.tasks.length && (!STATE.tasks || !STATE.tasks.length)) STATE.tasks = stateRes.tasks;
      if (Array.isArray(stateRes.contentItems) && stateRes.contentItems.length && (!STATE.contentItems || !STATE.contentItems.length)) STATE.contentItems = stateRes.contentItems;
      if (Array.isArray(stateRes.leads) && stateRes.leads.length && (!STATE.leads || !STATE.leads.length)) STATE.leads = stateRes.leads;

      if (Array.isArray(stateRes.allUsers) && stateRes.allUsers.length) {
        if (!STATE.allUsers) STATE.allUsers = [];
        stateRes.allUsers.forEach(bu => {
          const exIdx = STATE.allUsers.findIndex(u => u.email && u.email.toLowerCase().trim() === bu.email.toLowerCase().trim());
          if (exIdx >= 0) STATE.allUsers[exIdx] = { ...STATE.allUsers[exIdx], ...bu };
          else STATE.allUsers.push(bu);
        });
      }
      if (Array.isArray(stateRes.companies) && stateRes.companies.length) {
        if (!STATE.companies) STATE.companies = [];
        stateRes.companies.forEach(bc => {
          const exIdx = STATE.companies.findIndex(c => c.id === bc.id);
          if (exIdx >= 0) STATE.companies[exIdx] = { ...STATE.companies[exIdx], ...bc };
          else STATE.companies.push(bc);
        });
      }
    }
  } catch (e) {
    console.warn('State sync note:', e);
  }

  // 3. Cloud Sync: If Supabase PostgreSQL is connected, pull all records
  if (isSupabaseConnected()) {
    try {
      await pullFromSupabase();
    } catch (sbPullErr) {
      console.warn('Supabase cloud pull note:', sbPullErr);
    }
  }

  // Ensure robust data structure and seed sample data if empty
  if (!Array.isArray(STATE.clients)) STATE.clients = [];
  if (!Array.isArray(STATE.packages)) STATE.packages = [];
  if (!Array.isArray(STATE.payments)) STATE.payments = [];
  if (!Array.isArray(STATE.expenses)) STATE.expenses = [];
  if (!Array.isArray(STATE.staff)) STATE.staff = [];
  if (!Array.isArray(STATE.attendance)) STATE.attendance = [];
  if (!Array.isArray(STATE.salaryPayments)) STATE.salaryPayments = [];
  if (!Array.isArray(STATE.tasks)) STATE.tasks = [];
  if (!Array.isArray(STATE.contentItems)) STATE.contentItems = [];
  if (!Array.isArray(STATE.leads)) STATE.leads = [];
  if (!Array.isArray(STATE.userData)) STATE.userData = [];

  if (!STATE.clients || !STATE.clients.length) {
    seedData();
  }

  if (!STATE.settings) {
    STATE.settings = {
      agencyName: 'Metrovise',
      profession: 'general',
      tagline: 'Multi-Profession Business OS & Financial Engine',
      phone: '',
      email: '',
      currencySymbol: '₹',
      theme: 'light'
    };
  }
  if (!STATE.settings.profession) {
    STATE.settings.profession = 'general';
  }

  if (!STATE.serviceCatalog || !STATE.serviceCatalog.length) {
    const profCfg = getProfessionConfig(STATE.settings.profession);
    STATE.serviceCatalog = [...profCfg.services];
  }

  if (STATE.settings && STATE.settings.theme) {
    document.documentElement.setAttribute('data-theme', STATE.settings.theme);
  }

  // Check Supabase Auth session & PostgreSQL data
  if (isSupabaseConnected()) {
    try {
      const { data: { user }, error: uErr } = await _supabaseClient.auth.getUser();
      if (user && !uErr) {
        const cleanEmail = (user.email || '').toLowerCase().trim();
        const isSuperAdminEmail = cleanEmail === 'jeetrakholiya02@gmail.com' || cleanEmail === 'jeetrakholiya@gmail.com';
        STATE.currentUser = {
          id: user.id,
          email: user.email,
          name: (user.user_metadata && user.user_metadata.name) || user.email.split('@')[0],
          role: isSuperAdminEmail ? 'admin' : ((user.user_metadata && user.user_metadata.role) || 'manager'),
          isSuperAdmin: isSuperAdminEmail,
          avatar: (user.user_metadata && user.user_metadata.avatar_url) || (isSuperAdminEmail ? '👑' : '🏢'),
          companyName: STATE.settings ? STATE.settings.agencyName : 'AccountiX Media HQ'
        };
        STATE.isAuthenticated = true;
        if (isSuperAdminEmail) {
          STATE.activePanel = 'admin';
          STATE.view = 'admin_overview';
        }
        await syncFromSupabase();
      }
    } catch (sbErr) {
      console.warn('Supabase session restoration note:', sbErr);
    }
  }

  // Attempt backend JWT session & workspace hydration as secondary fallback
  try {
    const me = await AccountiX_API.fetchMe();
    if (me && me.user) {
      console.log('✓ JWT Session Authenticated:', me.user.name);
    }
    await AccountiX_API.fetchLogs();
  } catch(e) {}

  hideSessionLoading();
  render();
}

    const inTeam = document.getElementById('f_target_team');

    if (force || !inClients.dataset.userEdited) {
      if (inClients) inClients.value = needed;

    if (force || !inOutput.dataset.userEdited) {
      if (inOutput) inOutput.value = estimatedWork;

      STATE.settings.customProfessionConfig = {
        id: 'custom',
        name: cName,
        shortName: cName,

        tagline: `${cName} Business Operating System & Financial Engine`,
        clientTerm: cClTerm,

        services: (STATE.serviceCatalog && STATE.serviceCatalog.length) ? STATE.serviceCatalog : INDUSTRY_CONFIGS.general.services
      };

      if (INDUSTRY_CONFIGS[pKey]) {

function getServiceCatalog() {
  if (!STATE.serviceCatalog || !STATE.serviceCatalog.length) {
    const profCfg = getProfessionConfig();
    STATE.serviceCatalog = [...profCfg.services];
  }
  return STATE.serviceCatalog;
}

function getServiceDefaultPrice(serviceName) {
  const catalog = getServiceCatalog();
  const item = catalog.find(s => s.name === serviceName);
  return item ? Number(item.defaultAmount) : 35000;
}

function clientOutstanding(clientId) {
  const pkgs = STATE.packages.filter(p => p.clientId === clientId && p.status !== 'Cancelled');
  const total = pkgs.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const paid = STATE.payments.filter(p => p.clientId === clientId).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  return { total, paid, pending: Math.max(0, total - paid) };
}

function activePackage(clientId) {
  const pkgs = STATE.packages.filter(p => p.clientId === clientId && p.status !== 'Cancelled').sort((a, b) => new Date(b.endDate || 0) - new Date(a.endDate || 0));
  return pkgs[0] || null;
}

function inMonth(dateStr, ym) {
  return dateStr && dateStr.slice(0, 7) === ym;
}

function monthStats(ym = currentYM()) {
  const received = STATE.payments.filter(p => inMonth(p.date, ym)).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const expenses = STATE.expenses.filter(e => inMonth(e.date, ym)).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  const salaryExpenses = STATE.expenses.filter(e => inMonth(e.date, ym) && e.category === 'Salary').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  const profit = received - expenses;
  const revenueBooked = STATE.packages.filter(p => inMonth(p.startDate, ym) && p.status !== 'Cancelled').reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const totalOutstanding = STATE.clients.filter(c => c.status !== 'Inactive').reduce((sum, c) => sum + clientOutstanding(c.id).pending, 0);
  return { received, expenses, salaryExpenses, profit, revenueBooked, totalOutstanding };
}

/* ================= MODALS & TOAST ================= */
function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.innerHTML = `<span>⚡</span> ${msg}`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function showModal(html, width = 540) {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `<div class="modal" style="max-width: ${width}px;">${html}</div>`;
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.classList.add('open');
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.classList.remove('open');
}

function navigateTo(newView) {
  const role = (STATE.currentUser && STATE.currentUser.role) || 'manager';
  const isSuperAdmin = role === 'admin' && STATE.currentUser && (STATE.currentUser.isSuperAdmin || STATE.currentUser.role === 'admin');

  // Strict RBAC Guard: If user is an employee, only allow employee workspace views
  if (role === 'employee') {
    const allowedEmpViews = ['emp_workspace', 'emp_attendance', 'emp_content', 'emp_tasks', 'emp_payslips', 'user_data'];
    if (!allowedEmpViews.includes(newView)) {
      toast('⚠️ Restricted Access: Staff accounts have access to Employee Workspace only.');
      newView = 'emp_workspace';
    }
  }

  if (!STATE._history) STATE._history = [];
  if (STATE.view && STATE._history[STATE._history.length - 1] !== STATE.view) {
    STATE._history.push(STATE.view);
  }
  STATE.view = newView;
  STATE._search = '';
  if (STATE._history[STATE._history.length - 1] !== newView) {
    STATE._history.push(newView);
  }
  render();
}
window.navigateTo = navigateTo;

function navigateBack() {
  // 1. If an overlay modal is open, close modal as previous step
  const overlay = document.getElementById('overlay');
  if (overlay && overlay.classList.contains('open')) {
    closeModal();
    return;
  }

  // 2. If searching, clear search and return to current page
  if (STATE._search && STATE._search.trim().length > 0) {
    STATE._search = '';
    render();
    return;
  }

  // 3. Pop from navigation history
  if (STATE._history && STATE._history.length > 1) {
    STATE._history.pop(); // remove current view
    const prevView = STATE._history.pop();
    if (prevView && prevView !== STATE.view) {
      STATE.view = prevView;
      if (!STATE._history) STATE._history = [];
      STATE._history.push(prevView);
      render();
      return;
    }
  }

  // 4. Default fallback based on role
  const role = (STATE.currentUser && STATE.currentUser.role) || 'manager';
  const defaultRoot = role === 'admin' ? 'admin_overview' : role === 'employee' ? 'emp_workspace' : 'dashboard';
  if (STATE.view !== defaultRoot) {
    STATE.view = defaultRoot;
    STATE._history = [defaultRoot];
    render();
  } else {
    toast('Already on primary workspace page');
  }
}
window.navigateBack = navigateBack;

function buildNotifications() {
  const today = todayStr();
  const notifs = [];
  STATE.packages.forEach(p => {
    if (!p.endDate || p.status === 'Cancelled') return;
    const d = daysBetween(today, p.endDate);
    const c = STATE.clients.find(cl => cl.id === p.clientId);
    if (!c) return;
    if (d < 0) notifs.push({ type: 'Expired Package', text: `${c.name}'s package expired ${Math.abs(d)}d ago`, clientId: c.id, urgent: true });
    else if (d <= 7) notifs.push({ type: 'Renewal Due', text: `${c.name} renews in ${d} days`, clientId: c.id, urgent: true });
  });
  STATE.clients.forEach(c => {
    const out = clientOutstanding(c.id);
    if (out.pending > 0) notifs.push({ type: 'Payment Due', text: `${c.name} has ${fmtMoney(out.pending)} overdue`, clientId: c.id, urgent: true });
  });
  STATE.tasks.forEach(t => {
    if (t.status !== 'Done' && t.deadline && t.deadline < today) notifs.push({ type: 'Task Overdue', text: `"${t.title}" is overdue`, urgent: true });
  });
  return notifs;
}

/* ================= SECURITY & LOGIN AUDIT LOGGER ================= */
function recordLoginAudit(user, authMethod = 'Email & Password (Verified)') {
  if (!STATE.loginLogs) STATE.loginLogs = [];
  const now = new Date();
  const timeStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  
  const logEntry = {
    id: `log_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
    userId: user.id || 'usr_guest',
    userName: user.name || 'Anonymous User',
    userEmail: user.email || '—',
    role: user.role || 'manager',
    companyName: user.companyName || STATE.settings.agencyName || 'Primary Workspace',
    loginTime: timeStr,
    authMethod: authMethod,
    status: 'Success (Verified)',
    device: navigator.userAgent.includes('Mobile') ? 'Mobile Device' : 'Desktop Workstation'
  };

  if (!STATE.loginLogs.find(l => l.id === logEntry.id)) {
    STATE.loginLogs.unshift(logEntry);
  }
  if (user.id) {
    const existing = (STATE.allUsers || []).find(u => u.id === user.id || u.email === user.email);
    if (existing) existing.lastActiveAt = now.toISOString();
  }

  // Persist to server global logs so Admin on all devices sees it immediately
  if (window.AccountiX_API && typeof window.AccountiX_API.recordAudit === 'function') {
    window.AccountiX_API.recordAudit(logEntry);
  }
  saveState();
}
window.recordLoginAudit = recordLoginAudit;

async function submitGatewayAuthForm() {

  const errBox = document.getElementById('gateway_auth_error_box');
  if (errBox) { errBox.style.display = 'none'; errBox.innerHTML = ''; }

  if (!email || !pass) {
    toast('Please enter your email and password');
    return;
  }
  if (isReg && !name) {
    toast('Please enter your full name');

      gwErrBox.innerHTML = `✓ Password reset successfully for <b>${esc(email)}</b>! Click "Sign In to Workspace" below to enter.`;
    }

    toast('🎉 Password reset successfully! You can now log in.');

/* ================= GOOGLE CLOUD CONSOLE (OAUTH 2.0) AUTHENTICATION ================= */
const DEFAULT_GOOGLE_CLIENT_ID = '887215874415-2d33tga5m22tmguklgasu6nsn4pq1jv0.apps.googleusercontent.com';
let _googleTokenClient = null;

function initGoogleGIS(clientId) {
  const activeClientId = clientId || DEFAULT_GOOGLE_CLIENT_ID;
  if (!activeClientId || !window.google || !window.google.accounts) return;
  try {
    if (window.google.accounts.oauth2) {
      _googleTokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: activeClientId,
        scope: 'email profile openid',
        callback: async (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            toast('Verifying Google Account... ⏳');
            try {
              let profile = null;
              try {
                const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                  headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                });
                if (res.ok) {
                  profile = await res.json();
                } else {
                  const res2 = await fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${tokenResponse.access_token}`);
                  if (res2.ok) profile = await res2.json();
                }
              } catch (fe) {
                console.warn('Browser userinfo fetch note:', fe);
              }

              const targetRole = (STATE.currentUser && STATE.currentUser.role) || 'manager';
              const loginRes = await AccountiX_API.googleLogin(null, profile, targetRole, tokenResponse.access_token);
              if (loginRes && loginRes.success && loginRes.user) {
                closeModal();
                render();
                toast(`✓ Authenticated as ${loginRes.user.name}!`);
              } else {
                toast('Login error: ' + ((loginRes && loginRes.error) ? loginRes.error : 'Failed to authenticate with Google'));
              }
            } catch (err) {
              console.error('Google profile handling error:', err);
              toast('Google authentication failed. Please try again.');
            }
          }
        }
      });
    }

    if (window.google.accounts.id) {
      window.google.accounts.id.initialize({
        client_id: activeClientId,
        callback: async (response) => {
          if (response && response.credential) {
            toast('Verifying Google Token... ⏳');
            const targetRole = (STATE.currentUser && STATE.currentUser.role) || 'manager';
            const loginRes = await AccountiX_API.googleLogin(response.credential, null, targetRole);
            if (loginRes && loginRes.success && loginRes.user) {
              closeModal();
              render();
              toast(`✓ Signed in as ${loginRes.user.name}!`);
            }
          }
        }
      });
    }
  } catch (e) {
    console.warn('initGoogleGIS note:', e);
  }
}

// Auto-initialize GIS on load
if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {
    initGoogleGIS(DEFAULT_GOOGLE_CLIENT_ID);
  });
  // Also try immediately in case script is already ready
  setTimeout(() => initGoogleGIS(DEFAULT_GOOGLE_CLIENT_ID), 500);
}

  let clientId = (STATE.settings && STATE.settings.googleClientId) || localStorage.getItem('accountix_google_client_id') || DEFAULT_GOOGLE_CLIENT_ID;
  
  if (clientId) {
    if (!_googleTokenClient) initGoogleGIS(clientId);
    if (_googleTokenClient) {
      _googleTokenClient.requestAccessToken({ prompt: 'select_account' });

    if (window.google && window.google.accounts && window.google.accounts.id) {

  }

  initGoogleGIS(DEFAULT_GOOGLE_CLIENT_ID);

    _googleTokenClient.requestAccessToken({ prompt: 'select_account' });
  }
}

  const templates = {

      name: '🎯 Onboarding & Setup Walkthrough',
      subject: `Quick hand getting started with AccountiX? 👋`,
      body: `Hi ${user.name},\n\nI noticed you joined AccountiX for ${user.companyName}, but haven't had a chance to log in and set up your client retainers and team workflows yet.\n\nWe want to ensure you get full value from the system right away. Would you like a quick 10-minute 1-on-1 walkthrough where we assist you in:\n1. Importing your active clients & manager rate cards\n2. Setting up team attendance & content production pipelines\n3. Connecting your live Supabase cloud database\n\nFeel free to reply directly to this email or book a strategy session.\n\nBest regards,\nCustomer Success Team | AccountiX`
    },
    demo: {
      name: '🚀 Feature Tour & Strategy Check-in',
      subject: `Checking in on ${user.companyName}'s agency setup 🚀`,
      body: `Hi ${user.name},\n\nHope you are having a productive week! I wanted to check in and see if you need any assistance getting ${user.companyName} fully migrated onto AccountiX.\n\nOur team is available to help you configure your customized retainers, employee payroll calculations, and invoice templates.\n\nLet us know how we can best support your agency goals!\n\nBest regards,\nFounder & Operations Team | AccountiX`
    }
  };

  showModal(`

      <div>
        <h3 class="modal-title">✉️ Dispatch Re-Engagement Email</h3>
        <div style="font-size:12px; color:var(--text-muted);">To: ${esc(user.name)} (${esc(user.email)}) · ${esc(user.companyName)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>Select Retention Template</label>
      <select id="reengageTplSelect">
        <option value="onboarding">${templates.onboarding.name}</option>
        <option value="demo">${templates.demo.name}</option>
      </select>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>Email Subject</label>
      <input id="reengageSubject" value="${esc(templates.onboarding.subject)}" />
    </div>

    <div class="field" style="margin-bottom:18px;">
      <label>Email Message Body</label>
      <textarea id="reengageBody" rows="9" style="font-family:'Plus Jakarta Sans', sans-serif; font-size:12.5px; line-height:1.6;">${esc(templates.onboarding.body)}</textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-ghost" id="copyReengageBtn">📋 Copy Email Text</button>
      <button class="btn btn-primary" id="launchMailtoBtn">🚀 Open Email Client (mailto:)</button>
    </div>
  `, 600);

  const sel = document.getElementById('reengageTplSelect');
  const subInp = document.getElementById('reengageSubject');
  const bodyTxt = document.getElementById('reengageBody');

  if (sel) {
    sel.onchange = (e) => {
      const tpl = templates[e.target.value] || templates.onboarding;
      subInp.value = tpl.subject;
      bodyTxt.value = tpl.body;
    };
  }

  const cpBtn = document.getElementById('copyReengageBtn');
  if (cpBtn) {
    cpBtn.onclick = () => {
      navigator.clipboard.writeText(`Subject: ${subInp.value}\n\n${bodyTxt.value}`).then(() => {
        toast('Email text copied to clipboard!');
      });
    };
  }

  const mailtoBtn = document.getElementById('launchMailtoBtn');
  if (mailtoBtn) {
    mailtoBtn.onclick = () => {
      const url = `mailto:${encodeURIComponent(user.email)}?subject=${encodeURIComponent(subInp.value)}&body=${encodeURIComponent(bodyTxt.value)}`;
      window.open(url, '_blank');
      user.status = 'Re-Engagement Sent (Follow-Up Pending)';
      saveState();
      toast(`Re-engagement email launched for ${user.name}!`);
      closeModal();
      render();
    };
  }
}

function exportLoginLogsCsv() {
  const logs = STATE.loginLogs || [];
  if (!logs.length) {
    toast('No login logs to export');
    return;
  }
  const headers = ['ID', 'Timestamp', 'User Name', 'Email', 'Role', 'Company', 'Auth Method', 'Device', 'Status'];
  const rows = logs.map(l => [
    l.id,
    `"${l.loginTime}"`,
    `"${l.userName}"`,
    `"${l.userEmail}"`,
    `"${l.role}"`,
    `"${l.companyName}"`,
    `"${l.authMethod}"`,
    `"${l.device}"`,
    `"${l.status}"`
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AccountiX_Login_Audit_Logs_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Login audit logs CSV exported successfully! 📊');
}
window.exportLoginLogsCsv = exportLoginLogsCsv;

function getActiveStaffRecord() {
  const curr = STATE.currentUser;
  if (!curr) return STATE.staff[0] || { id: 'st_demo', name: 'Employee', role: 'Staff Specialist', baseSalary: 30000 };

  let staff = (STATE.staff || []).find(s => 
    s.id === curr.staffId || 
    (curr.email && s.phone === curr.email) ||
    (curr.email && s.email && s.email.toLowerCase() === curr.email.toLowerCase()) ||
    (curr.name && s.name && s.name.toLowerCase() === curr.name.toLowerCase())
  );

  if (!staff) {
    staff = {
      id: curr.staffId || `st_${Date.now()}`,
      name: curr.name || 'Team Member',
      role: curr.title || 'Staff Specialist',
      phone: curr.email || '',
      baseSalary: 30000,
      status: 'Active'
    };
    if (!STATE.staff) STATE.staff = [];
    STATE.staff.push(staff);
    curr.staffId = staff.id;
    saveLocalState();
  }
  return staff;
}

    STATE.attendance.push({

      status: status,
      checkIn: nowTime
    });

  saveState();

function renderMain() {

  if (!main) return;

  if (STATE._search && STATE._search.trim().length > 1) {
    main.innerHTML = renderSearch(STATE._search.trim());
    document.querySelectorAll('[data-search-client]').forEach(el => el.onclick = () => openClientProfileModal(el.dataset.searchClient));
    return;
  }

  switch (STATE.view) {
    // 👑 Super Admin Views
    case 'admin_overview': main.innerHTML = renderAdminOverviewView(); attachAdminOverview(); break;
    case 'admin_companies': main.innerHTML = renderAdminCompaniesView(); attachAdminCompanies(); break;
    case 'admin_users': main.innerHTML = renderAdminUsersView(); attachAdminUsers(); break;
    case 'admin_logs': main.innerHTML = renderAdminLogsView(); attachAdminLogs(); break;
    case 'admin_reengage': main.innerHTML = renderAdminReengageView(); attachAdminReengage(); break;
    case 'admin_plans': main.innerHTML = renderAdminPlansView(); attachAdminPlans(); break;

    // 👥 Employee Workspace Views
    case 'emp_workspace': main.innerHTML = renderEmpWorkspaceView(); attachEmpWorkspace(); break;
    case 'emp_attendance': main.innerHTML = renderEmpAttendanceView(); attachEmpAttendance(); break;
    case 'emp_content': main.innerHTML = renderEmpContentView(); attachEmpContent(); break;
    case 'emp_tasks': main.innerHTML = renderEmpTasksView(); attachEmpTasks(); break;
    case 'emp_payslips': main.innerHTML = renderEmpPayslipsView(); attachEmpPayslips(); break;

    // 🏢 Agency Manager OS Views
    case 'dashboard': main.innerHTML = renderDashboardView(); attachDashboard(); break;
    case 'clients': main.innerHTML = renderClientsView(); attachClients(); break;
    case 'content': main.innerHTML = renderContentView(); attachContent(); break;
    case 'sales': main.innerHTML = renderSalesView(); attachSales(); break;
    case 'team': main.innerHTML = renderTeamView(); attachTeam(); break;
    case 'finance': main.innerHTML = renderFinanceView(); attachFinance(); break;
    case 'user_data': main.innerHTML = renderUserDataView(); attachUserData(); break;
    case 'reports': main.innerHTML = renderReportsView(); attachReports(); break;
    case 'settings': main.innerHTML = renderSettingsView(); attachSettings(); break;
    default:
      if (STATE.currentUser && STATE.currentUser.role === 'admin') {
        main.innerHTML = renderAdminOverviewView(); attachAdminOverview();
      } else if (STATE.currentUser && STATE.currentUser.role === 'employee') {
        main.innerHTML = renderEmpWorkspaceView(); attachEmpWorkspace();
      } else {
        main.innerHTML = renderDashboardView(); attachDashboard();
      }
  }
}

function attachClients() {
  document.querySelectorAll('[data-cltab]').forEach(el => {
    el.onclick = () => {
      STATE._clientTab = el.dataset.cltab;
      renderMain();
    };
  });

  const n = document.getElementById('newClientBtn');
  if (n) n.onclick = () => openNewClientModal();

  const pBtn = document.getElementById('clientOpenPricingBtn');
  if (pBtn) pBtn.onclick = () => {
    STATE._clientTab = 'pricing';
    renderMain();
  };

  const addCat = document.getElementById('addNewServiceCatalogBtn');
  if (addCat) addCat.onclick = () => openEditServiceCatalogModal();

  document.querySelectorAll('[data-open-client]').forEach(el => {
    el.onclick = () => openClientProfileModal(el.dataset.openClient);
  });

  document.querySelectorAll('[data-edit-price]').forEach(el => {
    el.onclick = () => openEditServiceCatalogModal(el.dataset.editPrice);
  });

  document.querySelectorAll('[data-del-catalog]').forEach(el => {
    el.onclick = () => {
      const sid = el.dataset.delCatalog;
      if (confirm('Remove this service package from the catalog?')) {
        STATE.serviceCatalog = STATE.serviceCatalog.filter(s => s.id !== sid);
        saveState();
        toast('Service package removed');
        renderMain();
      }
    };
  });
}

      <textarea id="f_sc_desc" rows="2" placeholder="e.g. 12 Reels, Ad creative variations, A/B copy testing, weekly analytics call">${esc(item.description || '')}</textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveServiceCatalogBtn">Save Package Rate</button>
    </div>
  `, 540);

  const scCycSel = document.getElementById('f_sc_cycle');
  if (scCycSel) {
    scCycSel.onchange = (e) => {
      const isCust = e.target.value === '__custom__';
      const box = document.getElementById('f_sc_cycle_custom_box');
      if (box) box.style.display = isCust ? 'block' : 'none';
      if (isCust) { const inp = document.getElementById('f_sc_cycle_custom'); if (inp) inp.focus(); }
    };
  }

  document.getElementById('saveServiceCatalogBtn').onclick = () => {
    const name = document.getElementById('f_sc_name').value.trim();
    const amount = Number(document.getElementById('f_sc_amount').value);
    let cycle = document.getElementById('f_sc_cycle').value;
    if (cycle === '__custom__') {
      cycle = (document.getElementById('f_sc_cycle_custom') ? document.getElementById('f_sc_cycle_custom').value.trim() : '') || 'Custom Cycle';
    }
    const desc = document.getElementById('f_sc_desc').value.trim();

    if (!name || !amount) {
      toast('Service name and rate are required');
      return;
    }

    if (serviceId) {
      const s = STATE.serviceCatalog.find(i => i.id === serviceId);
      if (s) {
        s.name = name;
        s.defaultAmount = amount;
        s.cycle = cycle;
        s.description = desc;
      }
    } else {
      STATE.serviceCatalog.push({
        id: uid('srv'),
        name,
        defaultAmount: amount,
        cycle,
        description: desc

    saveState();
    closeModal();
    toast('Package rate card updated');
    renderMain();
  };

      <div class="field-row" style="margin-bottom:10px;">
        <div class="field" style="margin-bottom:0;">
          <label>Total Collected / Received Amount (₹)</label>
          <input type="number" id="f_edit_cl_collected" value="${out.paid}" placeholder="0" />
          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Setting this adjusts the client's collected payments and recalculates pending dues instantly.</div>
